<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMT system map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a22; --muted: #5b6b61; --panel: #fff; --line: #dfe5e0; --hover: #f2f6f3;
    --gmt: #00703c; --focus: #0b5cad; --live: #0a7d3b; --warn: #a3361b;
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; color: var(--ink); }
  #wrap { position: relative; height: 100%; min-height: 440px; }
  #map { position: absolute; inset: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 2; width: 300px;
    max-height: calc(100% - 24px); display: flex; flex-direction: column;
    background: var(--panel); border-radius: 10px; box-shadow: 0 2px 14px rgba(20,40,30,.18);
  }
  #panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel h1 { font-size: 1.05rem; line-height: 1.3; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .status { font-size: .8rem; color: var(--muted); margin: 0; }
  .status.problem { color: var(--warn); }
  .back { display: inline-block; font-size: .82rem; color: var(--gmt); font-weight: 600; text-decoration: none; margin-bottom: 6px; }
  .bar { display: flex; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .bar button { background: none; border: 0; padding: 0; color: var(--gmt); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 8px 7px; font: inherit; font-size: .85rem; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--route, var(--gmt)); }
  .list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; }

  .chip { display: inline-block; min-width: 2.1rem; text-align: center; border-radius: 4px; font-weight: 700; font-size: .8rem; padding: 2px 4px; box-sizing: border-box; }
  .route-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px; padding: 6px 16px; font-size: .9rem; }
  .route-row:hover { background: var(--hover); }
  .route-row a { color: var(--gmt); font-size: .8rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .route-row .live-count { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=checkbox] { accent-color: var(--gmt); margin: 0; }

  /* Ordered stop list on a route page: a line runs through the stop dots */
  .stop-row { position: relative; width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 10px; text-align: left;
    background: none; border: 0; padding: 7px 16px 7px 14px; font: inherit; color: inherit; cursor: pointer; }
  .stop-row:hover { background: var(--hover); }
  .stop-row::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 3px; background: var(--route); }
  li:first-child .stop-row::before { top: 50%; } li:last-child .stop-row::before { bottom: 50%; }
  .stop-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin: 3px 0 0 2px; border-radius: 50%; background: #fff; border: 3px solid var(--route); box-sizing: border-box; }
  .stop-name { font-size: .88rem; font-weight: 600; line-height: 1.3; }
  .stop-next { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stop-next .now { color: var(--live); font-weight: 600; }

  .mapboxgl-popup-content { font-family: inherit; padding: 12px 14px 10px; min-width: 220px; border-radius: 8px; }
  .pop h2 { font-size: .95rem; margin: 0 22px 2px 0; line-height: 1.3; }
  .pop .sub { font-size: .78rem; color: var(--muted); margin: 0 0 8px; }
  .pop ol { list-style: none; margin: 0 0 8px; padding: 0; }
  .pop li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); font-size: .85rem; }
  .pop li:first-child { border-top: 0; }
  .pop .when { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .pop .when small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }
  .pop .when.live small { color: var(--live); }
  .pop .none { font-size: .85rem; color: var(--muted); margin: 4px 0 8px; }
  .pop .amen { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
  .pop .amen span { font-size: .72rem; background: #eef3ef; border-radius: 3px; padding: 2px 6px; }
  .pop .notes { font-size: .75rem; color: var(--muted); margin: 4px 0 0; }

  #toggle { display: none; }
  @media (max-width: 640px) {
    #panel { width: auto; right: 12px; max-height: 50%; }
    #panel.collapsed > :not(header) { display: none; }
    #toggle { display: inline; float: right; background: none; border: 0; color: var(--gmt); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="map" role="region" aria-label="Transit map"></div>
  <aside id="panel" aria-label="Map controls"></aside>
</div>

<script>
// ---------- Configure ----------
const MAPBOX_TOKEN = "pk.YOUR_PUBLIC_TOKEN";   // restrict this token to your domains in your Mapbox account
const API_BASE = "https://gmt-system-map.YOUR-ACCOUNT.workers.dev";  // the Worker; use "" if the Worker also serves this page
const REFRESH_MS = 20000;                       // how often live buses and arrival times update
// --------------------------------

const routeParam = new URLSearchParams(location.search).get("route");
const DIR = "data/";
let routes = {}, routeStops = {}, stopsById = {}, hidden = new Set(), activeDir = null;
let openPopup = null, openStopId = null;

mapboxgl.accessToken = MAPBOX_TOKEN;
const map = new mapboxgl.Map({
  container: "map", style: "mapbox://styles/mapbox/light-v11",
  center: [-73.15, 44.45], zoom: 10.5, cooperativeGestures: true,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new mapboxgl.GeolocateControl({ showUserHeading: true }), "top-right");

// Only poll while someone can actually see the map (saves requests when the iframe is scrolled away).
let onScreen = true;
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) tick(); }).observe(document.getElementById("map"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
const canPoll = () => onScreen && !document.hidden;

map.on("load", async () => {
  map.addImage("heading", arrowImage(), { sdf: true });
  let lines, stops, meta;
  try {
    [lines, stops, meta] = await Promise.all(["routes.geojson", "stops.geojson", "routes.json"].map((f) => fetch(DIR + f).then((r) => r.json())));
  } catch {
    document.getElementById("panel").innerHTML = `<header><h1>Map data is missing</h1><p class="status problem">Run the build script and redeploy.</p></header>`;
    return;
  }
  meta.routes.forEach((r) => (routes[r.route_id] = r));
  routeStops = meta.stops;
  stops.features.forEach((f) => (stopsById[f.properties.stop_id] = { ...f.properties, coords: f.geometry.coordinates }));

  if (routeParam && !routes[routeParam]) {
    document.getElementById("panel").innerHTML = `<header><a class="back" href="?">All routes</a><h1>Route ${esc(routeParam)} isn’t in the current schedule</h1></header>`;
    return;
  }
  const only = routeParam ? ["==", ["get", "route_id"], routeParam] : null;
  const stopFilter = routeParam ? ["in", `|${routeParam}|`, ["get", "routes_key"]] : null;
  const routeColor = routeParam ? routes[routeParam].color : "#42524a";

  map.addSource("routes", { type: "geojson", data: lines });
  map.addLayer({ id: "route-casing", type: "line", source: "routes", filter: only,
    layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": "#fff", "line-width": ["interpolate", ["linear"], ["zoom"], 9, 3, 15, 10] } });
  map.addLayer({ id: "route-lines", type: "line", source: "routes", filter: only,
    layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1.5, 15, 6] } });

  map.addSource("stops", { type: "geojson", data: stops });
  map.addLayer({ id: "stops", type: "circle", source: "stops", filter: stopFilter,
    minzoom: routeParam ? 0 : 12.5,
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 3, 16, 7],
             "circle-color": "#fff", "circle-stroke-color": routeColor,
             "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 11, 1.5, 16, 3] } });
  map.addLayer({ id: "stop-selected", type: "circle", source: "stops", filter: ["==", ["get", "stop_id"], ""],
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 6, 16, 11], "circle-color": "rgba(0,0,0,0)",
             "circle-stroke-color": "#1c2a22", "circle-stroke-width": 2.5 } });

  map.addSource("buses", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "bus-heading", type: "symbol", source: "buses", filter: ["!=", ["get", "heading"], null],
    layout: { "icon-image": "heading", "icon-size": 0.8, "icon-rotate": ["get", "heading"],
              "icon-rotation-alignment": "map", "icon-allow-overlap": true },
    paint: { "icon-color": ["get", "color"] } });
  map.addLayer({ id: "bus-dots", type: "circle", source: "buses",
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 9, 8, 15, 12],
             "circle-color": ["get", "color"], "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
  map.addLayer({ id: "bus-labels", type: "symbol", source: "buses",
    layout: { "text-field": ["get", "short_name"], "text-size": ["interpolate", ["linear"], ["zoom"], 9, 9, 15, 12],
              "text-font": ["DIN Pro Bold", "Arial Unicode MS Bold"], "text-allow-overlap": true },
    paint: { "text-color": ["get", "text_color"] } });

  fitTo(lines.features.filter((f) => !routeParam || f.properties.route_id === routeParam));
  routeParam ? buildRoutePanel() : buildSystemPanel();

  map.on("click", "stops", (e) => showStop(e.features[0].properties.stop_id));
  map.on("click", "bus-dots", (e) => showBus(e.features[0].properties, e.lngLat));
  for (const l of ["stops", "bus-dots"]) {
    map.on("mouseenter", l, () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", l, () => (map.getCanvas().style.cursor = ""));
  }
  tick();
  setInterval(() => canPoll() && tick(), REFRESH_MS);
});

let lastTick = 0;
function tick() {
  if (Date.now() - lastTick < 5000 || !map.getSource("buses")) return;
  lastTick = Date.now();
  refreshBuses();
  if (routeParam) refreshRouteArrivals();
  if (openStopId) refreshPopup();
}

// ---------- live buses ----------
async function refreshBuses() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(`${API_BASE}/api/vehicles`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    data.features = data.features.filter((f) => routes[f.properties.route_id] && (!routeParam || f.properties.route_id === routeParam));
    const counts = {};
    for (const f of data.features) {
      const r = routes[f.properties.route_id];
      Object.assign(f.properties, { color: r.color, text_color: r.text_color, short_name: r.short_name });
      counts[r.route_id] = (counts[r.route_id] || 0) + 1;
    }
    map.getSource("buses").setData(data);
    applyFilter();
    const n = data.features.length;
    status.textContent = `${n} bus${n === 1 ? "" : "es"} running now · updated ${clock(Date.now() / 1000)}`;
    status.classList.remove("problem");
    document.querySelectorAll("[data-count]").forEach((el) => (el.textContent = counts[el.dataset.count] ? `${counts[el.dataset.count]} live` : ""));
  } catch {
    status.textContent = "Live bus locations are unavailable right now. Showing scheduled times.";
    status.classList.add("problem");
  }
}

// ---------- system panel ----------
function buildSystemPanel() {
  const ids = Object.keys(routes).sort((a, b) => (routes[a].sort - routes[b].sort) || routes[a].short_name.localeCompare(routes[b].short_name, undefined, { numeric: true }));
  panel(`
    <header>${toggleBtn()}<h1>All routes and live buses</h1>
      <p class="status" id="status" aria-live="polite">Loading buses…</p>
      <p class="status">Zoom in and select a stop to see its next arrivals.</p></header>
    <div class="bar"><button id="all">Show all</button><button id="none">Hide all</button></div>
    <ul class="list" id="route-list">${ids.map((id) => {
      const r = routes[id];
      return `<li class="route-row"><input type="checkbox" checked data-route="${esc(id)}" id="cb-${esc(id)}" aria-label="Show route ${esc(r.short_name)}">
        <label for="cb-${esc(id)}">${chip(r)}</label>
        <label for="cb-${esc(id)}">${esc(r.long_name)} <span class="live-count" data-count="${esc(id)}"></span></label>
        <a href="?route=${encodeURIComponent(id)}">Route map</a></li>`;
    }).join("")}</ul>`);
  document.getElementById("route-list").addEventListener("change", (e) => {
    const id = e.target.dataset.route; e.target.checked ? hidden.delete(id) : hidden.add(id); applyFilter();
  });
  const setAll = (on) => { document.querySelectorAll("#route-list input").forEach((cb) => { cb.checked = on; on ? hidden.delete(cb.dataset.route) : hidden.add(cb.dataset.route); }); applyFilter(); };
  document.getElementById("all").onclick = () => setAll(true);
  document.getElementById("none").onclick = () => setAll(false);
}

function applyFilter() {
  if (routeParam) return;
  const keep = hidden.size ? ["!", ["in", ["get", "route_id"], ["literal", [...hidden]]]] : null;
  ["route-casing", "route-lines", "bus-dots", "bus-labels"].forEach((l) => map.setFilter(l, keep));
  map.setFilter("bus-heading", keep ? ["all", ["!=", ["get", "heading"], null], keep] : ["!=", ["get", "heading"], null]);
  // A stop stays visible while any of its routes is shown.
  const visible = Object.keys(routes).filter((id) => !hidden.has(id));
  map.setFilter("stops", hidden.size ? ["any", ...visible.map((id) => ["in", `|${id}|`, ["get", "routes_key"]]), false] : null);
}

// ---------- single-route panel ----------
let routeArrivals = {};
function buildRoutePanel() {
  const r = routes[routeParam], dirs = Object.keys(routeStops[routeParam] || {});
  activeDir = dirs[0];
  document.documentElement.style.setProperty("--route", r.color);
  document.title = `Route ${r.short_name} ${r.long_name} · GMT system map`;
  panel(`
    <header>${toggleBtn()}<a class="back" href="?">All routes</a>
      <h1>${chip(r)} ${esc(r.long_name)}</h1>
      <p class="status" id="status" aria-live="polite">Loading buses…</p></header>
    ${dirs.length > 1 ? `<div class="tabs" role="tablist">${dirs.map((d) =>
      `<button role="tab" data-dir="${esc(d)}" aria-selected="${d === activeDir}">To ${esc(routeStops[routeParam][d].headsign || "direction " + d)}</button>`).join("")}</div>` : ""}
    <ol class="list" id="stop-list"></ol>`);
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    activeDir = b.dataset.dir;
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
    renderStopList();
  });
  renderStopList();
}

function renderStopList() {
  const ids = routeStops[routeParam][activeDir].stops;
  const ol = document.getElementById("stop-list");
  ol.innerHTML = ids.map((id, i) => {
    const s = stopsById[id]; if (!s) return "";
    const last = i === ids.length - 1;
    const next = last ? "Last stop" : summary(routeArrivals[id]?.[activeDir]);
    return `<li><button class="stop-row" data-stop="${esc(id)}"><span class="stop-dot"></span>
      <span><span class="stop-name">${esc(s.name)}</span><span class="stop-next" data-next="${esc(id)}">${next}</span></span></button></li>`;
  }).join("");
  ol.onclick = (e) => { const b = e.target.closest("[data-stop]"); if (b) showStop(b.dataset.stop, true); };
}

async function refreshRouteArrivals() {
  try {
    const res = await fetch(`${API_BASE}/api/arrivals?route=${encodeURIComponent(routeParam)}`);
    if (!res.ok) throw new Error();
    routeArrivals = (await res.json()).arrivals;
    const ids = routeStops[routeParam][activeDir].stops;
    document.querySelectorAll("[data-next]").forEach((el) => {
      if (el.dataset.next !== ids[ids.length - 1]) el.innerHTML = summary(routeArrivals[el.dataset.next]?.[activeDir]);
    });
  } catch { /* keep last values; status line already reports feed problems */ }
}

// Arrivals at a stop for this route, shown in the list: "4 min · 24 min · 2:15 PM"
function summary(list) {
  if (!list || !list.length) return "No more trips today";
  return list.map((a, i) => i === 0 && a.live ? `<span class="now">${when(a.time)}</span>` : when(a.time)).join(" · ");
}

// ---------- popups ----------
async function showStop(id, fly) {
  const s = stopsById[id]; if (!s) return;
  openStopId = id;
  map.setFilter("stop-selected", ["==", ["get", "stop_id"], id]);
  if (fly) map.easeTo({ center: s.coords, zoom: Math.max(map.getZoom(), 15) });
  if (openPopup) openPopup.remove();
  openPopup = new mapboxgl.Popup({ offset: 10, maxWidth: "300px" }).setLngLat(s.coords).setHTML(stopHtml(s, null)).addTo(map);
  openPopup.on("close", () => { if (openStopId === id) { openStopId = null; map.setFilter("stop-selected", ["==", ["get", "stop_id"], ""]); } });
  refreshPopup();
}

async function refreshPopup() {
  const id = openStopId;
  try {
    const res = await fetch(`${API_BASE}/api/arrivals?stop=${encodeURIComponent(id)}`);
    const body = await res.json();
    if (id === openStopId && openPopup) openPopup.setHTML(stopHtml(stopsById[id], res.ok ? (body.arrivals[id] || []) : "error"));
  } catch {
    if (id === openStopId && openPopup) openPopup.setHTML(stopHtml(stopsById[id], "error"));
  }
}

function stopHtml(s, arrivals) {
  const sub = [s.code && `Stop ${esc(s.code)}`, s.routes.map((r) => routes[r] ? `Route ${esc(routes[r].short_name)}` : "").filter(Boolean).join(", ")].filter(Boolean).join(" · ");
  let body;
  if (arrivals === null) body = `<p class="none">Loading arrivals…</p>`;
  else if (arrivals === "error") body = `<p class="none">Arrival times are unavailable right now.</p>`;
  else if (!arrivals.length) body = `<p class="none">No more buses scheduled at this stop today.</p>`;
  else body = `<ol>${arrivals.map((a) => `<li>${chip(routes[a.route_id] || { short_name: a.short_name, color: a.color })}
      <span>${esc(a.headsign ? "To " + a.headsign : "")}</span>
      <span class="when ${a.live ? "live" : ""}">${when(a.time)}<small>${a.live ? "Live" : "Scheduled"}</small></span></li>`).join("")}</ol>`;
  const amen = [...(s.amenities || [])];
  if (s.wheelchair === "yes") amen.unshift("Wheelchair accessible");
  if (s.wheelchair === "no") amen.unshift("Not wheelchair accessible");
  return `<div class="pop"><h2>${esc(s.name)}</h2><p class="sub">${sub}</p>${body}
    ${amen.length ? `<div class="amen">${amen.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    ${s.amenity_notes ? `<p class="notes">${esc(s.amenity_notes)}</p>` : ""}</div>`;
}

function showBus(p, lngLat) {
  const r = routes[p.route_id] || {}, ago = Math.max(0, Math.round((Date.now() - p.time) / 1000));
  new mapboxgl.Popup({ offset: 12, closeButton: false }).setLngLat(lngLat).setHTML(
    `<div class="pop"><h2>${chip(r)} ${esc(r.long_name || "")}</h2>
     <p class="sub">${p.headsign ? `To ${esc(p.headsign)} · ` : ""}${p.label ? `Bus ${esc(p.label)} · ` : ""}location from ${ago < 60 ? ago + " sec" : Math.round(ago / 60) + " min"} ago</p></div>`
  ).addTo(map);
}

// ---------- small helpers ----------
function panel(html) {
  const el = document.getElementById("panel"); el.innerHTML = html;
  const t = document.getElementById("toggle");
  if (innerWidth <= 640) { el.classList.add("collapsed"); t.setAttribute("aria-expanded", "false"); }
  t.onclick = () => t.setAttribute("aria-expanded", String(!el.classList.toggle("collapsed")));
}
const toggleBtn = () => `<button id="toggle" aria-expanded="true">${routeParam ? "Stops" : "Routes"}</button>`;
const chip = (r) => `<span class="chip" style="background:${esc(r.color || "#555")};color:${esc(r.text_color || "#fff")}">${esc(r.short_name || "")}</span>`;
function when(epoch) {
  const mins = Math.floor((epoch - Date.now() / 1000) / 60);
  if (mins < 1) return "Due";
  if (mins < 60) return `${mins} min`;
  return clock(epoch);
}
const clock = (epoch) => new Date(epoch * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
function fitTo(features) {
  const b = new mapboxgl.LngLatBounds();
  features.forEach((f) => f.geometry.coordinates.forEach((c) => b.extend(c)));
  if (!b.isEmpty()) map.fitBounds(b, { padding: { top: 40, bottom: 40, left: innerWidth > 640 ? 330 : 40, right: 50 }, duration: 0 });
}
function arrowImage() {
  const s = 48, c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d");
  g.beginPath(); g.moveTo(s / 2, 1); g.lineTo(s / 2 + 9, 13); g.lineTo(s / 2 - 9, 13); g.closePath(); g.fill();
  return { width: s, height: s, data: g.getImageData(0, 0, s, s).data };
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
</html>
