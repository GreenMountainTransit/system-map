<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMT system map</title>
<meta name="description" content="Live map of Green Mountain Transit routes, stops, buses and arrival times.">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="live.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a22; --muted: #56655c; --faint: #8a978f; --panel: #fff; --line: #e1e7e3; --hover: #f1f5f2;
    --gmt: #00703c; --focus: #0b5cad; --live: #0a7d3b; --warn: #a3361b; --chip-bg: #eef3ef;
    --panel-w: 330px;
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; color: var(--ink); }
  #wrap { position: relative; height: 100%; min-height: 460px; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  button { font: inherit; color: inherit; }

  /* ---------- panel ---------- */
  #panel {
    position: absolute; top: 12px; left: 12px; bottom: 12px; z-index: 2; width: var(--panel-w);
    display: flex; flex-direction: column; background: var(--panel); border-radius: 12px;
    box-shadow: 0 2px 16px rgba(20,40,30,.16); overflow: hidden;
  }
  #panel.fit { bottom: auto; max-height: calc(100% - 24px); }
  #panel header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  #panel h1 { font-size: 1.08rem; line-height: 1.3; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .status { font-size: .8rem; color: var(--muted); margin: 0; }
  .status.problem { color: var(--warn); }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; color: var(--gmt); font-weight: 600; text-decoration: none; margin-bottom: 8px; }
  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: .88rem; padding: 8px 10px 8px 32px;
    border: 1px solid #c9d3cc; border-radius: 8px; background: #fff; color: var(--ink); }
  .search > svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
  #panel header { position: relative; z-index: 3; }
  .search input::-webkit-search-cancel-button { cursor: pointer; }
  #q-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px 0; list-style: none; background: #fff;
    border-radius: 10px; box-shadow: 0 8px 28px rgba(20,40,30,.22); max-height: min(380px, 60vh); overflow-y: auto; z-index: 10; }
  #q-list .q-head { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 8px 12px 4px; }
  #q-list .q-empty { font-size: .84rem; color: var(--muted); padding: 10px 12px; }
  #q-list [role=option] { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: .87rem; }
  #q-list [role=option][aria-selected=true] { background: #e8f1ec; }
  #q-list mark { background: none; color: inherit; font-weight: 700; }
  .q-name { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }
  .q-meta { font-size: .72rem; color: var(--gmt); font-weight: 600; white-space: nowrap; }
  .q-stop { grid-template-columns: auto minmax(0, 1fr) !important; }
  .q-pin { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--chip-bg); color: var(--muted); }
  .q-pin svg { width: 16px; height: 16px; }
  .q-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .q-chips .chip { min-width: 1.7rem; font-size: .68rem; padding: 0 4px; }
  .q-more { font-size: .7rem; color: var(--muted); align-self: center; }
  .viewtoggle { display: flex; margin-top: 10px; background: var(--chip-bg); border-radius: 8px; padding: 3px; }
  .viewtoggle button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 6px 8px; font-size: .84rem; cursor: pointer; color: var(--muted); }
  .viewtoggle button[aria-pressed=true] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .freq-legend { padding: 14px 16px; }
  .periods { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .periods button { border: 1px solid #c9d3cc; background: #fff; border-radius: 999px; padding: 5px 11px; font-size: .8rem; cursor: pointer; color: var(--ink); }
  .periods button[aria-checked=true] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .tiers li { display: block !important; }
  .tiers button { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: .88rem; }
  .tiers button:hover { background: var(--hover); }
  .tiers button[aria-pressed=false] { color: var(--faint); } .tiers button[aria-pressed=false] .swatch { opacity: .25; }
  .tiers .tick { width: 18px; height: 18px; color: var(--gmt); } .tiers .tick svg { width: 18px; height: 18px; }
  .tiers button[aria-pressed=false] .tick { visibility: hidden; }
  .see-all { display: block; width: 100%; margin: -2px 0 10px; padding: 7px; border: 1px solid #c9d3cc; background: #fff; border-radius: 8px; font-size: .8rem; font-weight: 600; color: var(--gmt); cursor: pointer; }
  .see-all:hover { background: var(--hover); }
  .alltimes { max-height: 220px; overflow-y: auto; margin: -4px 0 4px; padding-right: 4px; }
  .at-group { padding: 6px 0; border-top: 1px solid var(--line); } .at-group:first-child { border-top: 0; }
  .at-head { margin: 0 0 4px; font-size: .8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .at-times { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .at-times .past { color: #b3bcb6; } .at-times .next { font-weight: 700; } .at-times .live { color: var(--live); }
  .svc dd .span-line { display: block; font-size: .76rem; color: var(--muted); }
  .freq-intro { font-size: .86rem; line-height: 1.45; margin: 0 0 12px; }
  .freq-legend ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
  .freq-legend li { display: flex; align-items: center; gap: 12px; font-size: .88rem; }
  .swatch { width: 36px; height: var(--w); background: var(--c); border-radius: 4px; flex: none; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px #e1e7e3; }
  .swatch.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 11px); box-shadow: none; }
  .freq-note { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 0; }
  .scroll { overflow-y: auto; overflow-x: hidden; flex: 1; overscroll-behavior: contain; }

  /* legend groups */
  .group { border-bottom: 1px solid var(--line); }
  .group-head { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 0 16px; }
  .group-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 11px 0; cursor: pointer;
    font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .group-toggle .count { font-weight: 600; color: var(--faint); letter-spacing: 0; }
  .group-toggle svg { width: 14px; height: 14px; margin-left: auto; transition: transform .15s; }
  .group-toggle[aria-expanded=false] svg { transform: rotate(-90deg); }
  .rows { list-style: none; margin: 0; padding: 0 0 6px; }
  .rows[hidden] { display: none; }
  .route-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px 6px 16px; }
  .route-row:hover, .route-row.hl { background: var(--hover); }
  .route-row label { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; cursor: pointer; min-width: 0; }
  .rname { font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
  .rfreq { grid-column: 2; font-size: .76rem; color: var(--muted); line-height: 1.3; }
  .rfreq .lv { color: var(--live); font-weight: 600; }
  .route-go { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--gmt); text-decoration: none; }
  .route-go:hover { background: #e3eee7; }
  .route-go svg { width: 18px; height: 18px; }
  input[type=checkbox] { accent-color: var(--gmt); margin: 0; width: 16px; height: 16px; }
  .route-row { transition: opacity .15s; }
  .scroll.has-hl .route-row:not(.hl) { opacity: .38; }
  .route-row.off .chip { opacity: .45; } .route-row.off .rname { color: var(--muted); }

  .chip { display: inline-block; min-width: 2.2rem; text-align: center; border-radius: 5px; font-weight: 700; font-size: .8rem; padding: 2px 5px; box-sizing: border-box; line-height: 1.35; }

  /* route view */
  .route-about { font-size: .86rem; line-height: 1.45; margin: 8px 0 0; color: var(--ink); }
  .svc { margin: 8px 0 0; font-size: .8rem; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--muted); }
  .svc dt { font-weight: 600; color: var(--ink); } .svc dd { margin: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 8px 8px; font-size: .84rem; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--route, var(--gmt)); }
  .stop-list { list-style: none; margin: 0; padding: 4px 0; }
  .stop-row { position: relative; width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 16px 7px 14px; cursor: pointer; }
  .stop-row:hover { background: var(--hover); }
  .stop-row::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 3px; background: var(--route); }
  .stop-list li:first-child .stop-row::before { top: 50%; } .stop-list li:last-child .stop-row::before { bottom: 50%; }
  .stop-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin: 3px 0 0 2px; border-radius: 50%; background: #fff; border: 3px solid var(--route); box-sizing: border-box; }
  .stop-row.tp .stop-dot { width: 16px; height: 16px; margin: 1px 0 0; border-width: 4px; }
  .stop-name { display: block; font-size: .88rem; font-weight: 600; line-height: 1.3; }
  .tp-tag { display: inline-block; margin-left: 6px; font-size: .68rem; font-weight: 600; color: var(--muted); background: var(--chip-bg); border-radius: 3px; padding: 1px 5px; vertical-align: 1px; }
  .stop-next { display: block; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stop-next .now { color: var(--live); font-weight: 600; }

  /* ---------- hover tooltip ---------- */
  #tip { position: absolute; z-index: 5; pointer-events: none; max-width: 300px; background: #fff; border-radius: 8px;
    box-shadow: 0 4px 18px rgba(20,40,30,.22); padding: 10px 12px; font-size: .82rem; line-height: 1.4; }
  #tip[hidden] { display: none; }
  #tip h3 { font-size: .9rem; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  #tip .t-route { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin-top: 6px; }
  #tip .t-route .chip, .pop .about .chip { align-self: start; }
  #tip .t-route p { margin: 0; } #tip .t-desc { color: var(--ink); } #tip .t-freq { color: var(--muted); font-size: .76rem; }
  #tip .more { color: var(--muted); margin: 6px 0 0; font-size: .76rem; }

  /* ---------- popup ---------- */
  .mapboxgl-popup { z-index: 3; } /* popups sit above the map controls, important on small screens */
  .mapboxgl-popup-content { font-family: inherit; padding: 14px 16px 12px; border-radius: 10px; box-shadow: 0 4px 20px rgba(20,40,30,.2); }
  .mapboxgl-popup-close-button { font-size: 20px; width: 28px; height: 28px; right: 4px; top: 4px; color: var(--muted); }
  .pop { min-width: 240px; }
  .pop h2 { font-size: 1rem; margin: 0 26px 2px 0; line-height: 1.3; }
  .pop .sub { font-size: .78rem; color: var(--muted); margin: 0 0 10px; }
  .pop .sub .tp { color: var(--ink); font-weight: 600; }
  .pop ol { list-style: none; margin: 0 0 10px; padding: 0; }
  .pop ol li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: .86rem; }
  .pop ol li:first-child { border-top: 0; }
  .pop .when { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .pop .when small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }
  .pop .when.live small { color: var(--live); }
  .pop .none { font-size: .85rem; color: var(--muted); margin: 4px 0 10px; }
  .feats { list-style: none; margin: 0 0 4px; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  .feats li { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; background: var(--chip-bg); border-radius: 999px; padding: 3px 9px 3px 4px; }
  .feats .ico { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: var(--gmt); }
  .feats .ico svg { width: 16px; height: 16px; }
  .feats li.no { background: #f7efe9; color: #7a3b22; } .feats li.no .ico { color: #a3361b; }
  .pop details { margin-top: 8px; font-size: .8rem; }
  .pop summary { cursor: pointer; color: var(--gmt); font-weight: 600; }
  .pop .about { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin-top: 8px; align-items: start; }
  .pop .about p { margin: 0 0 6px; line-height: 1.4; } .pop .about .f { color: var(--muted); font-size: .74rem; display: block; }
  .pop .src { font-size: .68rem; color: var(--faint); margin: 8px 0 0; }

  /* ---------- basemap picker ---------- */
  .basemaps { display: flex; background: #fff; border-radius: 8px; box-shadow: 0 0 0 2px rgba(0,0,0,.1); overflow: hidden; }
  .basemaps button { border: 0; background: #fff; padding: 6px 10px; font-size: .78rem; cursor: pointer; color: var(--ink); }
  .basemaps button + button { border-left: 1px solid var(--line); }
  .mapboxgl-ctrl.basemaps button[aria-pressed=true], .mapboxgl-ctrl.basemaps button[aria-pressed=true]:hover { background: var(--gmt); color: #fff; font-weight: 600; }
  .mapboxgl-ctrl.basemaps button { width: auto; height: auto; }

  .legend-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: #fff; border-bottom: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
  .legend-bar span { flex: 1; }
  .legend-bar button { background: none; border: 0; padding: 4px 0; font-size: .8rem; font-weight: 600; color: var(--gmt); cursor: pointer; }
  .legend-hint { margin: 8px 16px 2px; font-size: .74rem; color: var(--faint); }
  .pop-actions { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; }
  .pop-actions button, .pop-actions a { background: none; border: 0; padding: 0; font: inherit; font-size: .82rem; font-weight: 600; color: var(--gmt); text-decoration: none; cursor: pointer; }
  /* stop details: right-hand panel on desktop */
  #stop-panel { position: absolute; top: 12px; right: 12px; bottom: 12px; z-index: 4; width: 360px; display: flex; flex-direction: column;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(20,40,30,.18); overflow: hidden; }
  #stop-panel[hidden] { display: none; }
  .sp-head { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 8px; padding: 14px 12px 10px 16px; border-bottom: 1px solid var(--line); }
  .sp-head h2 { margin: 0; font-size: 1.05rem; line-height: 1.3; outline: none; }
  .sp-grip { display: none; }
  .sp-close { width: 32px; height: 32px; border: 0; border-radius: 8px; background: var(--chip-bg); font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
  .sp-body { flex: 1; overflow-y: auto; padding: 12px 16px 16px; overscroll-behavior: contain; }
  .sp-body .alltimes { max-height: none; overflow: visible; }
  .sp-body .pop { min-width: 0; }
  .sp-sub { margin: 0 0 6px; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  #wrap.stop-open .mapboxgl-ctrl-top-right, #wrap.stop-open .mapboxgl-ctrl-bottom-right { right: 372px; } /* keep controls and the Mapbox logo visible */
  .mapboxgl-ctrl-top-right, .mapboxgl-ctrl-bottom-right { transition: right .2s; }
  #toggle { display: none; }
  @media (max-width: 640px) {
    #panel, #stop-panel { transition: height .22s ease; touch-action: none; }
    #panel.dragging, #stop-panel.dragging { transition: none; }
    #panel .scroll, .sp-body { touch-action: pan-y; }
    #panel header input { touch-action: manipulation; }
    #stop-panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 55%; z-index: 6; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(20,40,30,.22); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sp-head { grid-template-columns: 1fr auto; padding-top: 4px; cursor: grab; }
    .sp-grip { display: block; grid-column: 1 / -1; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: #c9d3cc; margin: 2px 0 6px; }
    #wrap.stop-open .mapboxgl-ctrl-top-right, #wrap.stop-open .mapboxgl-ctrl-bottom-right { right: 0; }
    #panel header { cursor: grab; }
    :root { --panel-w: auto; }
    /* bottom sheet */
    #panel, #panel.fit { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 92%; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(20,40,30,.18); padding-bottom: env(safe-area-inset-bottom, 0px); }
    #panel.collapsed > :not(header) { display: none; }
    #panel.collapsed .viewtoggle, #panel.collapsed .route-about, #panel.collapsed .svc, #panel.collapsed .back { display: none; }
    #panel header { padding-top: 6px; }
    #panel h1 { font-size: 1rem; padding-right: 70px; }
    #toggle { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 26px; margin: 0 0 4px; padding: 0;
      background: none; border: 0; cursor: pointer; color: var(--gmt); font-size: .76rem; font-weight: 600; position: relative; }
    #toggle .grip { width: 40px; height: 5px; border-radius: 3px; background: #c9d3cc; }
    #toggle .t-label { position: absolute; right: 0; top: 30px; background: var(--chip-bg); border-radius: 6px; padding: 4px 10px; }
    #panel:not(.collapsed) #toggle .t-label::after { content: " ▾"; } #panel.collapsed #toggle .t-label::after { content: " ▴"; }
    .route-row { padding: 9px 10px 9px 16px; } .route-go { width: 40px; height: 40px; }
    input[type=checkbox] { width: 20px; height: 20px; }
    .search input { font-size: 16px; } /* stops iOS zooming in on focus */
    #q-list { max-height: 45vh; }
    #tip { display: none !important; }
    .basemaps button { padding: 7px 9px; }
    .mapboxgl-popup-content { padding: 12px 14px 10px; }
    .alltimes { max-height: 160px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="map" role="region" aria-label="Map of Green Mountain Transit routes, stops and live buses. The panel lists the same routes and stops for keyboard and screen reader use."></div>
  <aside id="panel" aria-label="Routes and stops"></aside>
  <aside id="stop-panel" aria-label="Stop details" hidden></aside>
  <div id="tip" role="tooltip" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
</div>

<script>
// ---------- Configure ----------
const MAPBOX_TOKEN = "pk.eyJ1Ijoid2hvZGdzb24iLCJhIjoiY212Z3o3bXhtMDBkODJ5cHYwaDRtM2J4ZiJ9.zwDLsKOUp_iLM28iDg2-Rg";
const SWIFTLY_KEY = "__SWIFTLY_KEY__";          // filled in automatically when the site is published (GitHub secret SWIFTLY_KEY)
const REFRESH_MS = 15000;                       // how often live buses and arrival times update
const HOME_BOUNDS = [[-73.30, 44.35], [-72.95, 44.60]]; // opening view: Burlington area out to Shelburne, Essex and Williston
const BASEMAPS = [
  { id: "light", label: "Map", url: "mapbox://styles/mapbox/light-v11" },
  { id: "standard", label: "Detailed", url: "mapbox://styles/mapbox/standard", standard: true },
  { id: "satellite", label: "Satellite", url: "mapbox://styles/mapbox/satellite-streets-v12" },
];
// --------------------------------

let routeParam = new URLSearchParams(location.search).get("route");
const DIR = "data/";
const liveReady = !SWIFTLY_KEY.startsWith("__");
GMTLive.configure({ key: liveReady ? SWIFTLY_KEY : "", dataDir: DIR });

let routes = {}, groups = [], routeStops = {}, stopsById = {}, linesData, stopsData;
let hidden = new Set(), highlighted = [], liveCounts = {}, lastBuses = { type: "FeatureCollection", features: [] };
let openPopup = null, openStopId = null, routeArrivals = {}, activeDir = null;
let basemap = BASEMAPS[0];
let view = new URLSearchParams(location.search).get("view") === "frequency" ? "frequency" : "routes";
let picking = false; // false: the legend shows its defaults; true: the rider has picked specific routes
let freqData;
const isPhone = () => innerWidth <= 640;
let sheetOpen = !isPhone(), sheetState = "collapsed"; // phone sheet: collapsed, mid or full
let freqPeriod = "mid", freqTiers = new Set([1, 2, 3, 4]), showAllTimes = false;
const FREQ_PERIODS = [
  { id: "peak", label: "Weekday rush hour", short: "Rush hour", note: "weekdays 7–9 AM and 4–6 PM" },
  { id: "mid", label: "Weekday midday", short: "Midday", note: "weekdays 9 AM–3 PM" },
  { id: "eve", label: "Weekday evening", short: "Evening", note: "weekdays 7–10 PM" },
];
try { basemap = BASEMAPS.find((b) => b.id === localStorage.getItem("gmt-basemap")) || basemap; } catch {}

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isSunday = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short" }).format(new Date()) === "Sun";
// Keep fitted routes clear of the panel: beside it on desktop, above the bottom sheet on phones.
const panelPad = () => isPhone()
  ? { top: 60, left: 24, right: 56, bottom: ((sheetState === "collapsed"
      ? document.querySelector("#panel header")?.offsetHeight : document.getElementById("panel")?.offsetHeight) || 140) + 24 }
  : { top: 40, bottom: 40, left: 370, right: openStopId ? 400 : 60 };

mapboxgl.accessToken = MAPBOX_TOKEN;
const map = new mapboxgl.Map({
  container: "map", style: basemap.url, bounds: HOME_BOUNDS, fitBoundsOptions: { padding: panelPad() },
  dragRotate: false, pitchWithRotate: false, touchPitch: false, maxPitch: 0, // flat 2D map
  logoPosition: "bottom-right", // keep the Mapbox logo clear of the panel
});
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();
map.addControl({
  onAdd() {
    const el = document.createElement("div");
    el.className = "mapboxgl-ctrl basemaps"; el.setAttribute("role", "group"); el.setAttribute("aria-label", "Basemap");
    el.innerHTML = BASEMAPS.map((b) => `<button type="button" data-id="${b.id}" aria-pressed="${b.id === basemap.id}">${b.label}</button>`).join("");
    el.onclick = (e) => {
      const b = BASEMAPS.find((x) => x.id === e.target.dataset.id);
      if (!b || b.id === basemap.id) return;
      basemap = b;
      try { localStorage.setItem("gmt-basemap", b.id); } catch {}
      el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.id === b.id));
      map.setStyle(b.url, { diff: false }); // full reload so our layers are re-added on style.load
    };
    return el;
  },
  onRemove() {},
}, "top-right"); // added first, so it sits in the corner with zoom and locate below it
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new mapboxgl.GeolocateControl({ showUserHeading: true }), "top-right");


// Only poll while someone can see the map.
let onScreen = true;
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) tick(); }).observe(document.getElementById("map"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

// ---------- data ----------
const dataReady = Promise.all(["routes.geojson", "stops.geojson", "routes.json"].map((f) => fetch(DIR + f).then((r) => r.json())))
  .then(async ([lines, stops, meta]) => {
    linesData = lines; stopsData = stops;
    freqData = await fetch(DIR + "frequency.geojson").then((r) => (r.ok ? r.json() : null)).catch(() => null) || { type: "FeatureCollection", features: [] };
    meta.routes.forEach((r) => (routes[r.route_id] = r));
    groups = meta.groups.length ? meta.groups : [{ id: "local", name: "Routes", default: "on" }];
    routeStops = meta.stops;
    stops.features.forEach((f) => (stopsById[f.properties.stop_id] = { ...f.properties, coords: f.geometry.coordinates }));
    if (routeParam && !routes[routeParam]) routeParam = meta.routes.find((r) => r.short_name === routeParam)?.route_id || routeParam;
    for (const r of meta.routes) {
      const g = groups.find((x) => x.id === r.group);
      if (g && (g.default === "off" || (g.default === "sundays" && !isSunday))) hidden.add(r.route_id);
    }
  });

dataReady.then(() => {
  if (routeParam && !routes[routeParam]) {
    panel(`<header><a class="back" href="?">${ICON.back} All routes</a><h1>Route ${esc(routeParam)} isn’t in the current schedule</h1></header>`);
    return;
  }
  routeParam ? buildRoutePanel() : buildSystemPanel();
}).catch(() => panel(`<header><h1>Map data is missing</h1><p class="status problem">Run the build workflow and try again.</p></header>`));

// Overlay layers are re-added whenever the basemap changes.
map.on("style.load", async () => {
  if (basemap.standard) for (const [k, v] of Object.entries({ show3dObjects: false, showTransitLabels: false, lightPreset: "day" }))
    try { map.setConfigProperty("basemap", k, v); } catch {}
  await dataReady.catch(() => {});
  if (!linesData) return;
  addOverlay();
  if (!addOverlay.fitted && routeParam && routes[routeParam]) {
    fitTo(linesData.features.filter((f) => f.properties.route_id === routeParam));
    addOverlay.fitted = true;
  }
  tick(true);
});

function addOverlay() {
  const slot = (s) => (basemap.standard ? { slot: s } : {});
  const add = (layer, s) => { if (!map.getLayer(layer.id)) map.addLayer({ ...layer, ...slot(s) }); };
  if (!map.hasImage("heading")) map.addImage("heading", arrowImage(), { sdf: true });
  Object.values(routes).forEach((r) => { if (!map.hasImage(`bus-${r.route_id}`)) map.addImage(`bus-${r.route_id}`, busBadge(r), { pixelRatio: 2 }); });
  if (!map.getSource("routes")) map.addSource("routes", { type: "geojson", data: linesData });
  if (!map.getSource("stops")) map.addSource("stops", { type: "geojson", data: stopsData });
  if (!map.getSource("buses")) map.addSource("buses", { type: "geojson", data: lastBuses });
  const sat = basemap.id === "satellite";
  const width = (a, b) => ["interpolate", ["linear"], ["zoom"], 9, a, 15, b];

  if (!map.getSource("freq")) map.addSource("freq", { type: "geojson", data: freqData });
  add({ id: "freq-casing", type: "line", source: "freq", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": sat ? "#000" : "#fff", "line-opacity": sat ? 0.5 : 1 } }, "middle");
  add({ id: "freq-lines", type: "line", source: "freq", layout: { "line-join": "round", "line-cap": "round" }, paint: {} }, "middle");
  add({ id: "freq-low", type: "line", source: "freq", layout: { "line-join": "round", "line-cap": "butt" },
    paint: { "line-color": FREQ[3].color, "line-width": width(1.2, 3), "line-dasharray": [2, 1.5] } }, "middle");
  add({ id: "route-glow", type: "line", source: "routes", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": ["get", "color"], "line-width": width(6, 14), "line-blur": width(3, 6), "line-opacity": 0.35 } }, "middle");
  add({ id: "route-casing", type: "line", source: "routes", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": sat ? "#000" : "#fff", "line-opacity": sat ? 0.5 : 1, "line-width": width(3.5, 10) } }, "middle");
  add({ id: "route-lines", type: "line", source: "routes", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": ["get", "color"], "line-width": width(1.8, 6) } }, "middle");

  const stopStroke = routeParam ? routes[routeParam].color : "#2b3a31";
  const tp = ["==", ["get", "timepoint"], true];
  add({ id: "stops", type: "circle", source: "stops", minzoom: routeParam ? 0 : 12,
    paint: { "circle-color": "#fff", "circle-stroke-color": stopStroke,
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, ["case", tp, 4, 2.5], 16, ["case", tp, 8, 6]],
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 11, ["case", tp, 2, 1.2], 16, ["case", tp, 3.5, 2.5]] } }, "top");
  add({ id: "stop-selected", type: "circle", source: "stops", filter: ["==", ["get", "stop_id"], openStopId || ""],
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 7, 16, 13], "circle-color": "rgba(0,0,0,0)",
      "circle-stroke-color": "#1c2a22", "circle-stroke-width": 2.5 } }, "top");
  add({ id: "timepoint-labels", type: "symbol", source: "stops", minzoom: 14.5,
    layout: { "text-field": ["format", ["get", "name"], { "font-scale": 1 }, "\n", {}, "Scheduled timepoint", { "font-scale": 0.82 }],
      "text-size": 12, "text-anchor": "top", "text-offset": [0, 0.9], "text-max-width": 12, "text-optional": true },
    paint: { "text-color": sat ? "#fff" : "#1c2a22", "text-halo-color": sat ? "rgba(0,0,0,.8)" : "#fff", "text-halo-width": 1.6 } }, "top");
  add({ id: "bus-heading", type: "symbol", source: "buses", filter: ["!=", ["get", "heading"], null],
    layout: { "icon-image": "heading", "icon-rotate": ["get", "heading"], "icon-rotation-alignment": "map",
      "icon-allow-overlap": true, "icon-ignore-placement": true },
    paint: { "icon-color": ["get", "color"], "icon-halo-color": "#fff", "icon-halo-width": 1.5 } }, "top");
  add({ id: "buses", type: "symbol", source: "buses",
    layout: { "icon-image": ["concat", "bus-", ["get", "route_id"]], "icon-size": ["interpolate", ["linear"], ["zoom"], 9, 0.8, 14, 1],
      "icon-allow-overlap": true, "icon-ignore-placement": true } }, "top");
  applyView();
}

// Frequency tiers, Jarrett Walker style: how long you'd wait on each street, all routes combined.
const FREQ = [
  { tier: 1, color: "#d1352b", label: "Every 15 min or better" },
  { tier: 2, color: "#2563b0", label: "Every 16–30 min" },
  { tier: 3, color: "#7aa7dc", label: "Every 31–60 min" },
  { tier: 4, color: "#8b979f", label: "Less than hourly", dashed: true },
];
// Tier for the chosen time of week: 1 = every 15 min or better ... 4 = less than hourly; 0 = no service then.
const tierExpr = () => { const h = ["get", "h_" + freqPeriod];
  return ["case", ["==", h, null], 0, ["<=", h, 15], 1, ["<=", h, 30], 2, ["<=", h, 60], 3, 4]; };
function applyFreq() {
  if (!map.getLayer("freq-lines")) return;
  const t = tierExpr(), on = ["in", t, ["literal", [...freqTiers]]];
  const w = (z9, z15) => ["interpolate", ["linear"], ["zoom"], 9, ["match", t, ...z9], 15, ["match", t, ...z15]];
  map.setFilter("freq-lines", ["all", on, [">=", t, 1], ["<=", t, 3]]);
  map.setFilter("freq-casing", ["all", on, [">=", t, 1], ["<=", t, 3]]);
  map.setFilter("freq-low", ["all", on, ["==", t, 4]]);
  map.setLayoutProperty("freq-lines", "line-sort-key", ["-", 5, t]);
  map.setLayoutProperty("freq-casing", "line-sort-key", ["-", 5, t]);
  map.setPaintProperty("freq-lines", "line-color", ["match", t, 1, FREQ[0].color, 2, FREQ[1].color, FREQ[2].color]);
  map.setPaintProperty("freq-lines", "line-width", w([1, 4.5, 2, 2.6, 1.6], [1, 11, 2, 7, 4.5]));
  map.setPaintProperty("freq-casing", "line-width", w([1, 7, 2, 4.5, 3], [1, 15, 2, 10, 7]));
}
function applyView() {
  if (!map.getLayer("route-lines")) return;
  const freq = view === "frequency" && !routeParam;
  ["freq-casing", "freq-lines", "freq-low"].forEach((l) => map.setLayoutProperty(l, "visibility", freq ? "visible" : "none"));
  ["route-glow", "route-casing", "route-lines"].forEach((l) => map.setLayoutProperty(l, "visibility", freq ? "none" : "visible"));
  ["stops", "stop-selected", "timepoint-labels"].forEach((l) => map.setLayoutProperty(l, "visibility", freq ? "none" : "visible")); // the frequency map is about streets, not stops
  applyFreq();
  applyFilters();
}

// ---------- visibility and highlight ----------
function visibleRoutes() {
  if (routeParam) return [routeParam];
  return Object.keys(routes).filter((id) => !hidden.has(id));
}
function applyFilters() {
  if (!map.getLayer("route-lines")) return;
  const vis = visibleRoutes();
  const onRoute = ["in", ["get", "route_id"], ["literal", vis]];
  const atStop = vis.length ? ["any", ...vis.map((id) => ["in", `|${id}|`, ["get", "routes_key"]])] : ["==", ["get", "stop_id"], "__none__"];
  ["route-casing", "route-lines"].forEach((l) => map.setFilter(l, onRoute));
  map.setFilter("route-glow", ["all", onRoute, ["in", ["get", "route_id"], ["literal", highlighted]]]);
  const stopFilter = atStop;
  map.setFilter("stops", stopFilter);
  map.setFilter("timepoint-labels", ["all", stopFilter, ["==", ["get", "timepoint"], true]]);
  map.setFilter("buses", onRoute);
  map.setFilter("bus-heading", ["all", onRoute, ["!=", ["get", "heading"], null]]);
  // While a route is hovered, everything else steps back: other lines, their casings and their buses.
  const isHl = ["in", ["get", "route_id"], ["literal", highlighted]], any = highlighted.length > 0;
  map.setPaintProperty("route-lines", "line-opacity", any ? ["case", isHl, 1, 0.2] : 1);
  map.setPaintProperty("route-casing", "line-opacity", any ? ["case", isHl, 1, 0.15] : (basemap.id === "satellite" ? 0.5 : 1));
  map.setPaintProperty("buses", "icon-opacity", any ? ["case", isHl, 1, 0.3] : 1);
  map.setPaintProperty("bus-heading", "icon-opacity", any ? ["case", isHl, 1, 0.3] : 1);
}
function highlight(ids) {
  const next = (ids || []).filter((id) => routes[id]);
  if (next.join() === highlighted.join()) return;
  highlighted = next;
  document.querySelectorAll(".route-row").forEach((el) => el.classList.toggle("hl", highlighted.includes(el.dataset.route)));
  document.querySelector(".scroll")?.classList.toggle("has-hl", highlighted.length > 0); // fade the other legend rows too
  applyFilters();
}

// ---------- hover tooltips (mouse only; the same details are in popups and the panel) ----------
const tip = document.getElementById("tip");
map.on("mousemove", (e) => {
  if (!map.getLayer("route-lines")) return;
  const b = 6, box = [[e.point.x - b, e.point.y - b], [e.point.x + b, e.point.y + b]];
  const layers = view === "frequency" && !routeParam ? ["buses", "freq-lines", "freq-low"] : ["buses", "stops", "route-lines"];
  const f = map.queryRenderedFeatures(box, { layers })[0];
  map.getCanvas().style.cursor = f ? "pointer" : "";
  if (!f) { hideTip(); if (!openStopId) highlight([]); return; }
  const p = f.properties;
  if (f.layer.id === "stops") {
    const s = stopsById[p.stop_id];
    const ids = s.routes.filter((id) => visibleRoutes().includes(id));
    highlight(ids);
    showTip(e.point, `<h3>${esc(s.name)}</h3>` +
      ids.slice(0, 5).map((id) => routeTipRow(routes[id], ids.length <= 3)).join("") +
      (ids.length > 5 ? `<p class="more">and ${ids.length - 5} more routes. Click the stop for details.</p>` : `<p class="more">Click for next arrivals.</p>`));
  } else if (f.layer.id === "freq-lines" || f.layer.id === "freq-low") {
    const h = p["h_" + freqPeriod], t = FREQ[(h <= 15 ? 1 : h <= 30 ? 2 : h <= 60 ? 3 : 4) - 1], many = String(p.routes).includes(",");
    const per = FREQ_PERIODS.find((x) => x.id === freqPeriod);
    showTip(e.point, `<h3><span style="display:inline-block;width:18px;height:5px;border-radius:3px;background:${t.color}"></span>${h >= 120 ? `About every ${Math.round(h / 60)} hours` : `About every ${h} min`}</h3>
      <p class="t-freq" style="margin:0">${many ? `Routes ${esc(p.routes)} combined` : `Route ${esc(p.routes)}`} · ${per.note}</p>`);
  } else if (f.layer.id === "buses") {
    const r = routes[p.route_id];
    highlight([p.route_id]);
    showTip(e.point, `<h3>${chip(r)} ${esc(p.headsign ? "To " + p.headsign : r.long_name)}</h3><p class="t-freq" style="margin:0">Bus ${esc(p.label)} · live location</p>`);
  } else {
    const r = routes[p.route_id];
    highlight([p.route_id]);
    showTip(e.point, `<h3>${chip(r)} ${esc(r.long_name)}</h3>${r.description ? `<p style="margin:0">${esc(r.description)}</p>` : ""}<p class="t-freq" style="margin:4px 0 0">${esc(freqText(r))}</p>`);
  }
});
map.getCanvasContainer().addEventListener("mouseleave", () => { hideTip(); if (!openStopId) highlight([]); });
function routeTipRow(r, withDesc) {
  return `<div class="t-route">${chip(r)}<div><p><strong>${esc(r.long_name)}</strong></p>${withDesc && r.description ? `<p class="t-desc">${esc(r.description)}</p>` : ""}<p class="t-freq">${esc(freqText(r))}</p></div></div>`;
}
function showTip(pt, html) {
  tip.innerHTML = html; tip.hidden = false;
  const W = document.getElementById("wrap").clientWidth, H = document.getElementById("wrap").clientHeight;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(pt.x + 16, W - w - 8) + "px";
  tip.style.top = (pt.y + 16 + h > H ? pt.y - h - 12 : pt.y + 16) + "px";
}
function hideTip() { tip.hidden = true; }

map.on("click", (e) => {
  if (!map.getLayer("route-lines")) return;
  const b = isPhone() ? 12 : 6, box = [[e.point.x - b, e.point.y - b], [e.point.x + b, e.point.y + b]];
  const freq = view === "frequency" && !routeParam;
  const f = map.queryRenderedFeatures(box, { layers: freq ? ["buses", "freq-lines", "freq-low"] : ["buses", "stops", "route-lines"] })[0];
  if (!f) return;
  const p = f.properties;
  hideTip();
  if (f.layer.id === "stops") return showStop(p.stop_id);
  if (openPopup) openPopup.remove();
  let html;
  if (f.layer.id === "buses") {
    const r = routes[p.route_id] || {}, ago = Math.max(0, Math.round((Date.now() - p.time) / 1000));
    html = `<div class="pop"><h2>${chip(r)} ${esc(p.headsign ? "To " + p.headsign : r.long_name)}</h2>
      <p class="sub">Bus ${esc(p.label)} · location from ${ago < 60 ? ago + " sec" : Math.round(ago / 60) + " min"} ago</p></div>`;
  } else if (f.layer.id === "route-lines") {
    const r = routes[p.route_id];
    highlight([r.route_id]);
    html = `<div class="pop"><h2>${chip(r)} ${esc(r.long_name)}</h2>${r.description ? `<p class="route-about" style="margin:0 0 6px">${esc(r.description)}</p>` : ""}
      <p class="sub">${esc(freqText(r))}</p>
      <div class="pop-actions">${routeParam ? "" : `<button type="button" data-solo="${esc(r.route_id)}">Show only this route</button>`}
      <a href="?route=${encodeURIComponent(r.short_name)}">Stops and times ›</a></div></div>`;
  } else {
    const h = p["h_" + freqPeriod], per = FREQ_PERIODS.find((x) => x.id === freqPeriod), many = String(p.routes).includes(",");
    html = `<div class="pop"><h2>${h >= 120 ? `About every ${Math.round(h / 60)} hours` : `About every ${h} min`}</h2>
      <p class="sub">${many ? `Routes ${esc(p.routes)} combined` : `Route ${esc(p.routes)}`} · ${per.note}</p></div>`;
  }
  openPopup = new mapboxgl.Popup({ offset: 12, maxWidth: "min(330px, 92vw)" }).setLngLat(e.lngLat).setHTML(html).addTo(map);
  openPopup.on("close", () => { if (!openStopId) highlight([]); });
  openPopup.getElement().querySelector("[data-solo]")?.addEventListener("click", (ev) => { openPopup.remove(); focusRoute(ev.target.dataset.solo); });
});

// ---------- live data ----------
let lastTick = 0;
function tick(force) {
  if (!map.getSource("buses") || (!force && Date.now() - lastTick < 5000)) return;
  if (!onScreen || document.hidden) return;
  lastTick = Date.now();
  refreshBuses();
  if (routeParam) refreshRouteArrivals();
  if (openStopId) refreshPopup();
}
setInterval(() => tick(), REFRESH_MS);

async function refreshBuses() {
  const status = document.getElementById("status");
  if (!liveReady) { if (status) status.textContent = "Live buses aren’t connected yet. Showing scheduled times."; return; }
  try {
    const data = await GMTLive.vehicles();
    data.features = data.features.filter((f) => routes[f.properties.route_id]);
    liveCounts = {};
    for (const f of data.features) {
      const r = routes[f.properties.route_id];
      Object.assign(f.properties, { color: r.color, short_name: r.short_name });
      liveCounts[r.route_id] = (liveCounts[r.route_id] || 0) + 1;
    }
    lastBuses = data;
    map.getSource("buses")?.setData(data);
    const n = visibleRoutes().reduce((sum, id) => sum + (liveCounts[id] || 0), 0);
    if (status) { status.textContent = `${n} bus${n === 1 ? "" : "es"} running now · updated ${clock(Date.now() / 1000)}`; status.classList.remove("problem"); }
    document.querySelectorAll("[data-live]").forEach((el) => {
      const c = liveCounts[el.dataset.live]; el.innerHTML = c ? ` · <span class="lv">${c} live</span>` : "";
    });
  } catch {
    if (status) { status.textContent = "Live bus locations are unavailable right now. Showing scheduled times."; status.classList.add("problem"); }
  }
}

// ---------- system panel ----------
function buildSystemPanel() {
  const byGroup = groups.map((g) => ({ ...g, ids: Object.values(routes).filter((r) => r.group === g.id)
    .sort((a, b) => (a.sort - b.sort) || a.short_name.localeCompare(b.short_name, undefined, { numeric: true })).map((r) => r.route_id) }))
    .filter((g) => g.ids.length);
  const per = FREQ_PERIODS.find((x) => x.id === freqPeriod);
  const legend = view === "frequency" ? `
    <div class="scroll freq-legend">
      <div class="periods" role="radiogroup" aria-label="Time of day">${FREQ_PERIODS.map((x) =>
        `<button type="button" role="radio" data-period="${x.id}" aria-checked="${x.id === freqPeriod}">${x.short}</button>`).join("")}</div>
      <p class="freq-intro">How often a local bus comes on each street, <strong>${per.note}</strong>. Where routes share a street, like Main Street in Burlington, their buses add up.</p>
      <ul class="tiers" aria-label="Filter by frequency">${FREQ.map((t) => `<li><button type="button" data-tier="${t.tier}" aria-pressed="${freqTiers.has(t.tier)}">
        <span class="swatch ${t.dashed ? "dashed" : ""}" style="--c:${t.color};--w:${[0, 7, 5, 3.5, 2.5][t.tier]}px"></span><span>${t.label}</span>
        <span class="tick" aria-hidden="true">${ICON.check}</span></button></li>`).join("")}</ul>
      <p class="freq-note">Click a frequency to show or hide it. Hover over a street for its exact frequency and routes. Weekday local routes only; commuter, express, school and shopping routes aren’t included.</p>
    </div>` : `
    <div class="scroll">
      <div class="legend-bar"><span id="vis-count" aria-live="polite"></span>

// ---------- search: routes and stops ----------
function searchBox(withRoutes, stopIds) {
  const stopPool = (stopIds ? stopIds.map((id) => stopsById[id]) : Object.values(stopsById)).filter(Boolean);
  const routePool = withRoutes ? Object.values(routes) : [];
  queueMicrotask(() => wireSearch(routePool, stopPool));
  const ph = withRoutes ? "Search routes and stops" : "Search stops on this route";
  return `<div class="search">${ICON.search}<label for="q" class="sr-only">${ph}</label>
    <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="q-list" placeholder="${ph}" autocomplete="off" spellcheck="false">
    <ul id="q-list" role="listbox" aria-label="Search results" hidden></ul></div>`;
}
function wireSearch(routePool, stopPool) {
  const input = document.getElementById("q"), list = document.getElementById("q-list");
  if (!input) return;
  let items = [], active = -1;
  const norm = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]+/g, " ");
  const mark = (text, q) => {
    const i = norm(text).indexOf(q);
    return i < 0 || !q ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  };
  const score = (name, q) => { const n = norm(name); if (n.startsWith(q)) return 0; if (n.includes(" " + q)) return 1; return n.includes(q) ? 2 : null; };
  function render() {
    const raw = input.value.trim(), q = norm(raw).trim().replace(/^route /, "");
    if (!q) { close(); return; }
    const rs = routePool.map((r) => ({ r, s: r.short_name.toLowerCase() === q ? -1 : r.short_name.toLowerCase().startsWith(q) ? 0 : score(r.long_name, q) }))
      .filter((x) => x.s != null).sort((a, b) => a.s - b.s || a.r.sort - b.r.sort).slice(0, 5);
    const ss = stopPool.map((st) => ({ st, s: score(st.name, q) })).filter((x) => x.s != null)
      .sort((a, b) => a.s - b.s || a.st.name.localeCompare(b.st.name)).slice(0, 8);
    items = [...rs.map((x) => ({ type: "route", id: x.r.route_id })), ...ss.map((x) => ({ type: "stop", id: x.st.stop_id }))];
    active = items.length ? 0 : -1;
    let n = 0;
    const opt = (inner, cls) => `<li role="option" id="q-${n}" class="${cls}" data-i="${n}" aria-selected="${n++ === active}">${inner}</li>`;
    list.innerHTML = (!items.length ? `<li class="q-empty" role="presentation">No routes or stops match “${esc(raw)}”</li>` : "") +
      (rs.length ? `<li class="q-head" role="presentation">Routes</li>` + rs.map(({ r }) => opt(`${chip(r)}<span class="q-name">${mark(r.long_name, q)}</span><span class="q-meta">Show on map</span>`, "q-route")).join("") : "") +
      (ss.length ? `<li class="q-head" role="presentation">Stops</li>` + ss.map(({ st }) => {
        const rr = st.routes.map((id) => routes[id]).filter(Boolean);
        return opt(`<span class="q-pin">${ICON.pin}</span><span class="q-name">${mark(st.name, q)}<span class="q-chips">${rr.slice(0, 6).map(chip).join("")}${rr.length > 6 ? `<span class="q-more">+${rr.length - 6}</span>` : ""}</span></span>`, "q-stop");
      }).join("") : "");
    list.hidden = false; input.setAttribute("aria-expanded", "true"); sync();
  }
  function sync() {
    list.querySelectorAll("[role=option]").forEach((el) => el.setAttribute("aria-selected", +el.dataset.i === active));
    if (active >= 0) { input.setAttribute("aria-activedescendant", "q-" + active); list.querySelector(`#q-${active}`)?.scrollIntoView({ block: "nearest" }); }
    else input.removeAttribute("aria-activedescendant");
  }
  function close() { list.hidden = true; list.innerHTML = ""; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); items = []; active = -1; }
  function choose(i) {
    const it = items[i]; if (!it) return;
    input.value = ""; close(); input.blur();
    if (it.type === "stop") showStop(it.id, true);
    else if (routeParam) location.search = "?route=" + encodeURIComponent(routes[it.id].short_name);
    else focusRoute(it.id);
  }
  input.addEventListener("input", render);
  input.addEventListener("focus", () => { if (input.value.trim()) render(); });
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && items.length) { active = (active + 1) % items.length; sync(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && items.length) { active = (active - 1 + items.length) % items.length; sync(); e.preventDefault(); }
    else if (e.key === "Enter") { if (active >= 0) choose(active); e.preventDefault(); }
    else if (e.key === "Escape") { input.value = ""; close(); }
  });
  list.addEventListener("mousedown", (e) => { const li = e.target.closest("[role=option]"); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
  list.addEventListener("mousemove", (e) => { const li = e.target.closest("[role=option]"); if (li && +li.dataset.i !== active) { active = +li.dataset.i; sync(); } });
}

// ---------- service text ----------
const DAY = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAYS_LONG = ["Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays", "Sundays"];
function daysLabel(d) {
  const k = d.map((x) => (x ? 1 : 0)).join("");
  if (k === "1111111") return "Daily";
  if (k === "1111110") return "Mon–Sat";
  if (k === "1111100") return "Weekdays";
  if (k === "0000011") return "Weekends";
  if (k === "0000000") return "No trips in the next two weeks";
  const on = d.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
  return on.length === 1 ? `${DAYS_LONG[on[0]]} only` : on.map((i) => DAY[i]).join(", ");
}
const mins = (x) => (x >= 120 && x % 60 === 0 ? `${x / 60} hr` : `${x} min`);
// "every 20 min peak, 30 min other times", from the build's time-of-day headways.
function phrase(d, detailed) {

  const p = d.periods || {}, peaks = [p.am, p.pm].filter(Boolean);
  const peak = peaks.length ? Math.min(...peaks) : null, base = p.mid || d.headway || peak, eve = p.eve;
  if (!base || (d.trips <= 10 && !p.mid)) return tripCounts(d);
  const lateService = d.last >= 19.5 * 3600;
  if (peak && !p.mid && !eve) return `${peak === 60 ? "hourly" : `every ${mins(peak)}`}, rush hours only`;
  let out;
  if (peak && peak < base) {

// "3 morning, 1 midday and 3 afternoon trips"
function tripCounts(d) {
  const parts = Object.entries(d.parts || {}).filter(([, n]) => n);
  if (!parts.length) return `${d.trips} trip${d.trips === 1 ? "" : "s"}`;
  const total = parts.reduce((s, [, n]) => s + n, 0);
  const list = parts.map(([k, n]) => `${n} ${k}`);
  const joined = list.length > 1 ? list.slice(0, -1).join(", ") + " and " + list[list.length - 1] : list[0];

  const weekend = main === s.weekday && (s.days[5] || s.days[6]) && s.days.slice(0, 5).filter(Boolean).length > 1;
  return `${days} · ${weekend ? "weekdays " : ""}${phrase(main)}`;

    `<span class="span-line">${clock(dayEpoch(x.first))}${x.trips > 1 ? `–${clock(dayEpoch(x.last))}` : ""} from ${esc(shortStop(x.from))}</span>`).join("")}` : "No service"}</dd>`;

    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  return Math.floor(Date.now() / 1000) - (+p.hour * 3600 + +p.minute * 60 + +p.second) + secs;

  if (t) { t.setAttribute("aria-expanded", String(open)); t.querySelector(".sr-only").textContent = open ? "Hide the list" : "Show the list"; }

function snapSheet(el, state) {

  const H = document.getElementById("wrap").clientHeight;
  if (el.id === "panel") { sheetState = state; sheetOpen = state !== "collapsed"; }
  el.classList.toggle("collapsed", state === "collapsed");

// Drag the top of a sheet up or down; it settles at the nearest height. Dragging the stop sheet low closes it.

function draggable(el, handleSel) {

    if (!isPhone() || !e.target.closest(handleSel)) return;
    if (e.target.closest("input, a, [role=option], .sp-close, .viewtoggle")) return;
    start = { y: e.clientY, h: el.offsetHeight, moved: false };
    start_focusedSearch = document.activeElement?.id === "q";
  });
  addEventListener("pointermove", (e) => {
    if (!start) return;
    const dy = start.y - e.clientY;
    if (!start.moved && Math.abs(dy) < 6) return;
    start.moved = true;
    const H = document.getElementById("wrap").clientHeight;
    el.classList.remove("collapsed"); el.classList.add("dragging");
    el.style.height = Math.max(90, Math.min(H * 0.92, start.h + dy)) + "px";

    if (document.activeElement?.id === "q" && !start_focusedSearch) document.activeElement.blur(); // a drag isn't a tap on search
    const H = document.getElementById("wrap").clientHeight, h = el.offsetHeight;
    if (el.id === "stop-panel") return h < H * 0.25 ? closeStop() : snapSheet(el, h > H * 0.72 ? "full" : "mid");
    const head = el.querySelector("header")?.offsetHeight || 140;
    const snaps = [["collapsed", head], ["mid", H * 0.5], ["full", H * 0.88]];
    snapSheet(el, snaps.sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0]);

draggable(document.getElementById("panel"), "header");
draggable(stopPanel, ".sp-head");
addEventListener("resize", () => { setSheet(sheetOpen); if (openStopId) snapSheet(stopPanel, "mid"); });
const toggleBtn = (label) => `<button id="toggle" aria-expanded="true"><span class="grip" aria-hidden="true"></span><span class="t-label">${label}</span><span class="sr-only">Show the list</span></button>`;
const chip = (r) => `<span class="chip" style="background:${esc(r.color || "#555")};color:${esc(r.text_color || "#fff")}">${esc(r.short_name || "")}</span>`;
function when(epoch) {
  const mins = Math.floor((epoch - Date.now() / 1000) / 60);
  if (mins < 1) return "Due";
  if (mins < 60) return `${mins} min`;
  return clock(epoch);
}
const clock = (epoch) => new Date(epoch * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
function fitTo(features, animate) {
  const b = new mapboxgl.LngLatBounds();
  features.forEach((f) => f.geometry.coordinates.forEach(([lon, lat]) => { if (lon > -75 && lon < -70 && lat > 42 && lat < 46) b.extend([lon, lat]); }));
  if (!b.isEmpty()) map.fitBounds(b, { padding: panelPad(), duration: animate && !reduceMotion ? 700 : 0 });
}

// Heading pointer: a small triangle on a ring around the bus badge, rotated to the bus's direction.
function arrowImage() {
  const S = 96, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  g.beginPath(); g.moveTo(S / 2, 4); g.lineTo(S / 2 + 10, 20); g.lineTo(S / 2 - 10, 20); g.closePath(); g.fill();
  return { width: S, height: S, data: g.getImageData(0, 0, S, S).data };

// Route-colored badge with a bus pictogram and the route number, drawn at 2x for sharp screens.
function busBadge(r) {
  const k = 2, h = 24 * k, pad = 5 * k, icon = 14 * k, gap = 4 * k, radius = 7 * k, stroke = 2 * k;
  const font = `700 ${13 * k}px "Public Sans", system-ui, sans-serif`;
  const label = String(r.short_name || "");
  const m = document.createElement("canvas").getContext("2d"); m.font = font;
  const w = Math.ceil(pad + icon + (label ? gap + m.measureText(label).width : 0) + pad);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  const rr = (x, y, ww, hh, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + ww, y, x + ww, y + hh, rad);
    g.arcTo(x + ww, y + hh, x, y + hh, rad); g.arcTo(x, y + hh, x, y, rad); g.arcTo(x, y, x + ww, y, rad); g.closePath(); };
  rr(stroke / 2, stroke / 2, w - stroke, h - stroke, radius);
  g.fillStyle = r.color || "#555"; g.fill();
  g.lineWidth = stroke; g.strokeStyle = "#fff"; g.stroke();
  // bus pictogram (front view)
  const fg = r.text_color || "#fff", bx = pad, by = (h - icon) / 2, u = icon / 14;
  g.fillStyle = fg;
  rr(bx + 1 * u, by, 12 * u, 11.5 * u, 2.5 * u); g.fill();
  g.fillRect(bx + 2.5 * u, by + 11 * u, 2.5 * u, 3 * u); g.fillRect(bx + 9 * u, by + 11 * u, 2.5 * u, 3 * u);
  g.fillStyle = r.color || "#555";
  rr(bx + 2.5 * u, by + 2 * u, 9 * u, 5 * u, 1 * u); g.fill();
  g.beginPath(); g.arc(bx + 4 * u, by + 9.3 * u, 1 * u, 0, 7); g.arc(bx + 10 * u, by + 9.3 * u, 1 * u, 0, 7); g.fill();
  if (label) {
    g.fillStyle = fg; g.font = font; g.textBaseline = "middle";
    g.fillText(label, pad + icon + gap, h / 2 + 1 * k);
  }
  return { width: w, height: h, data: g.getImageData(0, 0, w, h).data };
}
