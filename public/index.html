<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMT system map</title>
<meta name="description" content="Live map of Green Mountain Transit routes, stops, buses and arrival times.">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="live.js"></script>
<script src="planner.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a22; --muted: #56655c; --faint: #8a978f; --panel: #fff; --line: #e1e7e3; --hover: #f1f5f2;
    --gmt: #00703c; --focus: #0b5cad; --live: #0a7d3b; --warn: #a3361b; --chip-bg: #eef3ef;
    --panel-w: 300px; --stop-w: 320px;
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; color: var(--ink); }
  #wrap { position: relative; height: 100%; min-height: 460px; overflow: hidden; }
  #map { position: absolute; top: 0; bottom: 0; left: var(--panel-w); right: 0; }
  #wrap.stop-open #map { right: var(--stop-w); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  button { font: inherit; color: inherit; }

  /* ---------- panel ---------- */
  #panel {
    position: absolute; top: 0; left: 0; bottom: 0; z-index: 2; width: var(--panel-w); box-sizing: border-box;
    display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow: hidden;
  }
  #panel header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  #panel h1 { font-size: 1.08rem; line-height: 1.3; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .status { font-size: .8rem; color: var(--muted); margin: 0; }
  .status.problem { color: var(--warn); }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: #c3ccc6; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + .track { background: var(--gmt); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; color: var(--gmt); font-weight: 600; text-decoration: none; margin-bottom: 8px; }
  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: .88rem; padding: 8px 10px 8px 32px;
    border: 1px solid #c9d3cc; border-radius: 8px; background: #fff; color: var(--ink); }
  .search > svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
  #panel header { position: relative; z-index: 3; }
  .search input::-webkit-search-cancel-button { cursor: pointer; }
  #q-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px 0; list-style: none; background: #fff;
    border-radius: 10px; box-shadow: 0 8px 28px rgba(20,40,30,.22); max-height: min(380px, 60vh); overflow-y: auto; z-index: 10; }
  #q-list .q-head { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 8px 12px 4px; }
  #q-list .q-empty { font-size: .84rem; color: var(--muted); padding: 10px 12px; }
  #q-list [role=option] { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: .87rem; }
  #q-list [role=option][aria-selected=true] { background: #e8f1ec; }
  #q-list mark { background: none; color: inherit; font-weight: 700; }
  .q-name { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }
  .q-meta { font-size: .72rem; color: var(--gmt); font-weight: 600; white-space: nowrap; }
  .q-stop { grid-template-columns: auto minmax(0, 1fr) !important; }
  .q-pin { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--chip-bg); color: var(--muted); }
  .q-pin svg { width: 16px; height: 16px; }
  .q-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .q-chips .chip { min-width: 1.7rem; font-size: .68rem; padding: 0 4px; }
  .q-more { font-size: .7rem; color: var(--muted); align-self: center; }
  .planner { padding: 12px 16px 16px; }
  .pl-fields { display: grid; gap: 8px; }
  .pl-field { position: relative; display: grid; grid-template-columns: 14px 1fr 36px; align-items: center; gap: 8px; }
  .pl-field input { font: inherit; font-size: .88rem; padding: 8px 10px; border: 1px solid #c9d3cc; border-radius: 8px; min-width: 0; color: var(--ink); }
  .pl-dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #c9d3cc; }
  .pl-dot.from { background: #0a7d3b; } .pl-dot.to { background: #c2410c; }
  .pl-me { width: 36px; height: 36px; border: 1px solid #c9d3cc; border-radius: 8px; background: #fff; color: var(--gmt); cursor: pointer; display: grid; place-items: center; }
  .pl-me svg { width: 18px; height: 18px; }
  .pl-list { position: absolute; left: 22px; right: 44px; top: calc(100% + 4px); z-index: 10; margin: 0; padding: 4px 0; list-style: none; background: #fff;
    border-radius: 10px; box-shadow: 0 8px 28px rgba(20,40,30,.22); max-height: 300px; overflow-y: auto; }
  .pl-list[hidden] { display: none; }
  .pl-list [role=option] { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: .86rem; }
  .pl-list [role=option][aria-selected=true] { background: #e8f1ec; }
  .pl-sub { display: block; font-size: .72rem; color: var(--muted); }
  .pl-when { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .pl-when select, .pl-when input { font: inherit; font-size: .86rem; padding: 7px 8px; border: 1px solid #c9d3cc; border-radius: 8px; background: #fff; color: var(--ink); }
  .pl-go { margin-left: auto; border: 0; border-radius: 8px; background: var(--gmt); color: #fff; font-weight: 600; font-size: .88rem; padding: 8px 16px; cursor: pointer; }
  .pl-opts { list-style: none; margin: 10px 0 8px; padding: 0; display: grid; gap: 8px; }
  .pl-opt { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .pl-opt.open { border-color: #9fb8a8; box-shadow: 0 1px 6px rgba(20,40,30,.1); }
  .pl-card { width: 100%; display: grid; gap: 6px; text-align: left; background: #fff; border: 0; padding: 10px 12px; cursor: pointer; font: inherit; }
  .pl-card.static { cursor: default; }
  .pl-opt.open .pl-card { background: #f3f7f4; }
  .pl-times { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; } .pl-times span { color: var(--muted); font-size: .82rem; }
  .pl-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .pl-walk { display: inline-flex; align-items: center; gap: 1px; font-size: .74rem; color: var(--muted); } .pl-walk svg { width: 15px; height: 15px; }
  .pl-sep { color: var(--faint); font-size: .8rem; }
  .pl-meta { font-size: .76rem; color: var(--muted); }
  .pl-live { margin: 0; } .pl-live:empty { display: none; }
  .pl-steps { list-style: none; margin: 0; padding: 4px 12px 12px; display: grid; gap: 10px; font-size: .82rem; }
  .pl-steps li { display: grid; grid-template-columns: 38px 1fr; gap: 8px; align-items: start; line-height: 1.4; }
  .st-ico { display: grid; place-items: center; color: var(--muted); } .st-ico svg { width: 18px; height: 18px; }
  .st-sub { display: block; color: var(--muted); font-size: .76rem; }
  .viewtoggle { display: flex; margin-top: 10px; background: var(--chip-bg); border-radius: 8px; padding: 3px; }
  .viewtoggle button { white-space: nowrap; font-size: .8rem !important; padding: 6px 4px !important; }
  .viewtoggle button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 6px 8px; font-size: .84rem; cursor: pointer; color: var(--muted); }
  .viewtoggle button[aria-pressed=true] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .freq-legend { padding: 14px 16px; }
  .periods { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .periods button { border: 1px solid #c9d3cc; background: #fff; border-radius: 999px; padding: 5px 11px; font-size: .8rem; cursor: pointer; color: var(--ink); }
  .periods button[aria-checked=true] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .tiers li { display: block !important; }
  .tiers button { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; font-size: .88rem; }
  .tiers button:hover { background: var(--hover); }
  .tiers button[aria-pressed=false] { color: var(--faint); } .tiers button[aria-pressed=false] .swatch { opacity: .25; }
  .tiers .tick { width: 18px; height: 18px; color: var(--gmt); } .tiers .tick svg { width: 18px; height: 18px; }
  .tiers button[aria-pressed=false] .tick { visibility: hidden; }
  .see-all { display: block; width: 100%; margin: -2px 0 10px; padding: 7px; border: 1px solid #c9d3cc; background: #fff; border-radius: 8px; font-size: .8rem; font-weight: 600; color: var(--gmt); cursor: pointer; }
  .see-all:hover { background: var(--hover); }
  .alltimes { max-height: 220px; overflow-y: auto; margin: -4px 0 4px; padding-right: 4px; }
  .at-group { padding: 6px 0; border-top: 1px solid var(--line); } .at-group:first-child { border-top: 0; }
  .at-head { margin: 0 0 4px; font-size: .8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .at-times { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .at-times .past { color: #b3bcb6; } .at-times .next { font-weight: 700; } .at-times .live { color: var(--live); }
  .svc dd .span-line { display: block; font-size: .76rem; color: var(--muted); }
  .freq-intro { font-size: .86rem; line-height: 1.45; margin: 0 0 12px; }
  .freq-legend ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
  .freq-legend li { display: flex; align-items: center; gap: 12px; font-size: .88rem; }
  .swatch { width: 36px; height: var(--w); background: var(--c); border-radius: 4px; flex: none; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px #e1e7e3; }
  .swatch.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 11px); box-shadow: none; }
  .freq-note { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 0; }
  .scroll { overflow-y: auto; overflow-x: hidden; flex: 1; overscroll-behavior: contain; }

  /* legend groups */
  .group { border-bottom: 1px solid var(--line); }
  .group-head { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 0 16px; }
  .group-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 11px 0; cursor: pointer;
    font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .group-toggle .count { font-weight: 600; color: var(--faint); letter-spacing: 0; }
  .group-toggle svg { width: 14px; height: 14px; margin-left: auto; transition: transform .15s; }
  .group-toggle[aria-expanded=false] svg { transform: rotate(-90deg); }
  .rows { list-style: none; margin: 0; padding: 0 0 6px; }
  .rows[hidden] { display: none; }
  .route-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px 6px 16px; }
  .route-row:hover, .route-row.hl { background: var(--hover); }
  .route-row label { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; cursor: pointer; min-width: 0; }
  .rname { font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
  .rfreq { grid-column: 2; font-size: .76rem; color: var(--muted); line-height: 1.3; }
  .rfreq .lv { color: var(--live); font-weight: 600; }
  .route-go { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--gmt); text-decoration: none; }
  .route-go:hover { background: #e3eee7; }
  .route-go svg { width: 18px; height: 18px; }
  input[type=checkbox] { accent-color: var(--gmt); margin: 0; width: 16px; height: 16px; }
  .route-row { transition: opacity .15s, background-color .15s; }
  .route-row.sel { background: #e4ece6; box-shadow: inset 4px 0 0 var(--rc); }
  .route-row.sel:hover, .route-row.sel.hl { background: #dae5dd; }
  .scroll.has-hl .route-row:not(.hl) { opacity: .38; }
  .route-row.off .chip { opacity: .45; } .route-row.off .rname { color: var(--muted); }

  .chip { display: inline-block; min-width: 2.2rem; text-align: center; border-radius: 5px; font-weight: 700; font-size: .8rem; padding: 2px 5px; box-sizing: border-box; line-height: 1.35; }

  /* route view */
  .route-about { font-size: .86rem; line-height: 1.45; margin: 8px 0 0; color: var(--ink); }
  .svc { margin: 8px 0 0; font-size: .8rem; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--muted); }
  .svc dt { font-weight: 600; color: var(--ink); } .svc dd { margin: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 8px 8px; font-size: .84rem; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--route, var(--gmt)); }
  .stop-list { list-style: none; margin: 0; padding: 4px 0; }
  .stop-row { position: relative; width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 16px 7px 14px; cursor: pointer; }
  .stop-row:hover { background: var(--hover); }
  .stop-row::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 3px; background: var(--route); }
  .stop-list li:first-child .stop-row::before { top: 50%; } .stop-list li:last-child .stop-row::before { bottom: 50%; }
  .stop-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin: 3px 0 0 2px; border-radius: 50%; background: #fff; border: 3px solid var(--route); box-sizing: border-box; }
  .stop-row.tp .stop-dot { width: 16px; height: 16px; margin: 1px 0 0; border-width: 4px; }
  .stop-name { display: block; font-size: .88rem; font-weight: 600; line-height: 1.3; }
  .tp-tag { display: inline-block; margin-left: 6px; font-size: .68rem; font-weight: 600; color: var(--muted); background: var(--chip-bg); border-radius: 3px; padding: 1px 5px; vertical-align: 1px; }
  .stop-next { display: block; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .stop-next .now { color: var(--live); font-weight: 600; }

  /* ---------- hover tooltip ---------- */
  #tip { position: absolute; z-index: 5; pointer-events: none; max-width: 300px; background: #fff; border-radius: 8px;
    box-shadow: 0 4px 18px rgba(20,40,30,.22); padding: 10px 12px; font-size: .82rem; line-height: 1.4; }
  #tip[hidden] { display: none; }
  #tip h3 { font-size: .9rem; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  #tip .t-route { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin-top: 6px; }
  #tip .t-route .chip, .pop .about .chip { align-self: start; }
  #tip .t-route p { margin: 0; } #tip .t-desc { color: var(--ink); } #tip .t-freq { color: var(--muted); font-size: .76rem; }
  #tip .more { color: var(--muted); margin: 6px 0 0; font-size: .76rem; }

  /* ---------- popup ---------- */
  .ctrl-tip { position: absolute; z-index: 6; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: .78rem; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .ctrl-tip[hidden] { display: none; }
  .expand-ctrl[hidden] { display: none; }
  .three-ctrl[hidden] { display: none; }
  .three-btn { width: 36px !important; height: 30px !important; font-weight: 800; font-size: .78rem; color: var(--ink); }
  .three-btn[aria-pressed=true] { background: var(--gmt) !important; color: #fff; }
  #follow-bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 6px 8px 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.2); font-size: .84rem; font-weight: 600; white-space: nowrap; }
  #follow-bar[hidden] { display: none; }
  #follow-bar button { border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; font-size: .8rem; }
  .toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 5; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px;
    font-size: .82rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: opacity .6s ease; max-width: 90%; text-align: center; }
  .toast.out { opacity: 0; }
  .fs-hint { position: absolute; z-index: 21; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: .8rem; font-weight: 600;
    padding: 7px 11px; border-radius: 8px; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); animation: fs-in .35s ease both; transition: opacity .6s ease; }
  .fs-hint::after { content: ""; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-right: 0; border-left-color: var(--ink); }
  .fs-hint.out { opacity: 0; }
  .expand-btn.pulse { animation: fs-pulse 1.2s ease-in-out 4; }
  @keyframes fs-in { from { opacity: 0; transform: translate(6px, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
  @keyframes fs-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,112,60,.45); } 50% { box-shadow: 0 0 0 7px rgba(0,112,60,0); } }
  @media (prefers-reduced-motion: reduce) { .fs-hint, .expand-btn.pulse { animation: none; } }
  /* Click-to-activate shade (embeds only) */
  #activate { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; border: 0; padding: 0; margin: 0; cursor: pointer;
    background: rgba(28, 42, 34, .16); transition: opacity .3s ease; font: inherit; }
  #activate.gone { opacity: 0; pointer-events: none; }
  #activate .act-pill { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); border-radius: 999px;
    padding: 11px 20px 11px 16px; font-size: .95rem; font-weight: 700; box-shadow: 0 6px 24px rgba(20,40,30,.25); animation: act-in .5s ease .2s both; }
  #activate .act-pill svg { color: var(--gmt); }
  #activate:hover .act-pill, #activate:focus-visible .act-pill { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(20,40,30,.3); }
  @keyframes act-in { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #activate .act-pill { animation: none; } }
  .expand-ctrl .expand-btn { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); }
  #alert-banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; max-width: min(420px, calc(100% - 120px)); }
  #alert-banner[hidden] { display: none; }
  .ab-btn { display: flex; align-items: center; gap: 8px; margin: 0 auto; border: 1px solid #f3c5a0; background: #fff4ea; color: #7c2d12; border-radius: 999px;
    padding: 6px 12px; font-size: .82rem; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .ab-btn svg { width: 16px; height: 16px; } .ab-btn svg:last-child { width: 14px; height: 14px; }
  .ab-btn[aria-expanded=true] svg:last-child { transform: rotate(180deg); }
  .ab-list { margin-top: 6px; background: #fff; border-radius: 10px; box-shadow: 0 8px 28px rgba(20,40,30,.22); max-height: 50vh; overflow-y: auto; padding: 4px 12px; }
  .alerts { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
  .ab-list .alerts { margin: 8px 0; }

// Frequency tiers, Jarrett Walker style: how long you'd wait on each street, all routes combined.
const FREQ = [
  { tier: 1, color: "#d1352b", label: "Every 15–20 min" },
  { tier: 2, color: "#2563b0", label: "Every 21–30 min" },
  { tier: 3, color: "#7aa7dc", label: "Every 31–60 min" },
  { tier: 4, color: "#8b979f", label: "Less than hourly", dashed: true },
];
// Tier for the chosen time of week: 1 = every 15 min or better ... 4 = less than hourly; 0 = no service then.
// h is the average time between buses on the street (all local routes combined, busier direction).
const tierOf = (h) => (h == null ? 0 : h <= 20 ? 1 : h <= 30 ? 2 : h <= 60 ? 3 : 4);
const freqHeadline = (h) => FREQ[tierOf(h) - 1].label;
const waitText = (h) => (h >= 120 ? `About every ${Math.round(h / 60)} hours` : `About every ${h} min on average`);
const tierExpr = () => { const h = ["get", "h_" + freqPeriod];
  return ["case", ["==", h, null], 0, ["<=", h, 20], 1, ["<=", h, 30], 2, ["<=", h, 60], 3, 4]; };
function applyFreq() {
  if (!map.getLayer("freq-lines")) return;
  const t = tierExpr(), on = ["in", t, ["literal", [...freqTiers]]];
  const w = (z9, z15) => ["interpolate", ["linear"], ["zoom"], 9, ["match", t, ...z9], 15, ["match", t, ...z15]];
  map.setFilter("freq-lines", ["all", on, [">=", t, 1], ["<=", t, 3]]);
  map.setFilter("freq-casing", ["all", on, [">=", t, 1], ["<=", t, 3]]);
  map.setFilter("freq-low", ["all", on, ["==", t, 4]]);
  map.setLayoutProperty("freq-lines", "line-sort-key", ["-", 5, t]);
  map.setLayoutProperty("freq-casing", "line-sort-key", ["-", 5, t]);
  map.setPaintProperty("freq-lines", "line-color", ["match", t, 1, FREQ[0].color, 2, FREQ[1].color, FREQ[2].color]);
  map.setPaintProperty("freq-lines", "line-width", w([1, 4.5, 2, 2.6, 1.6], [1, 11, 2, 7, 4.5]));
  map.setPaintProperty("freq-casing", "line-width", w([1, 7, 2, 4.5, 3], [1, 15, 2, 10, 7]));
}
function applyView() {
  if (!map.getLayer("route-lines")) return;
  const freq = view === "frequency" && !routeParam, plan = view === "plan" && !routeParam, routesOn = !freq && !plan;
  const vis = (on) => (on ? "visible" : "none");
  ["freq-casing", "freq-lines", "freq-low"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(freq)));
  ["route-glow", "route-casing", "route-lines", "route-arrows"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(routesOn)));
  ["stops", "stop-selected", "timepoint-labels"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(routesOn))); // the frequency map is about streets, not stops
  PLAN_LAYERS.forEach((l) => map.getLayer(l) && map.setLayoutProperty(l, "visibility", vis(plan)));
  applyFreq();
  applyFilters();
}

// ---------- visibility and highlight ----------

}
const DETOUR_LAYERS = ["detour-closed-mask", "detour-closed-line", "detour-casing", "detour-line", "detour-arrows", "detour-closed-stops", "detour-closed-x", "detour-temp", "detour-temp-label"];
function applyFilters() {

  ["route-casing", "route-lines", "route-arrows"].forEach((l) => map.setFilter(l, onRoute));

  map.setPaintProperty("stops", "circle-stroke-width", ["interpolate", ["linear"], ["zoom"], 11, ["case", tp, 2, 1.2], 16, ["case", tp, 3.5, 2.5]]);
  if (map.getLayer("detour-line")) {

    const kinds = { "detour-closed-mask": "closed", "detour-closed-line": "closed", "detour-casing": "path", "detour-line": "path", "detour-arrows": "path",
      "detour-closed-stops": "closedstop", "detour-closed-x": "closedstop", "detour-temp": "temp", "detour-temp-label": "temp" };
    for (const [l, k] of Object.entries(kinds)) map.setFilter(l, ["all", ["==", ["get", "kind"], k], onDetourRoute]);

  map.setPaintProperty("route-casing", "line-opacity", any ? ["case", isHl, 1, 0.15] : (basemap.id === "satellite" ? 0.5 : 1));
  map.setPaintProperty("buses", "icon-opacity", any ? ["case", isHl, 1, 0.3] : 1);
  const arrowFade = ["interpolate", ["linear"], ["zoom"], 12, 0, 12.6, 0.95, 16.3, 0.95, 17, 0];
  map.setPaintProperty("route-arrows", "icon-opacity", any ? ["case", isHl, arrowFade, 0] : arrowFade);

// "to Downtown Burlington", "to Essex Junction"… shown under each live bus.
const niceDest = (h) => String(h || "").replace(/^Downtown Transit Center.*$/i, "Downtown Burlington").replace(/\s+(Bay|Berth)\s*\w*$/i, "");
async function refreshBuses() {
  markRoutes(); // keep legend warning marks after the list is redrawn
  const status = document.getElementById("status");
  if (!liveReady) { if (status) status.textContent = "Live buses aren’t connected yet. Showing scheduled times."; return; }
  if (!liveBusesOn) {
    if (status) { status.textContent = "Live buses are off"; status.classList.remove("problem"); }
    document.querySelectorAll("[data-live]").forEach((el) => (el.innerHTML = ""));
    return; // no requests to Swiftly for bus locations while off
  }
  try {
    const data = await GMTLive.vehicles();
    data.features = data.features.filter((f) => routes[f.properties.route_id]);
    liveCounts = {};
    for (const f of data.features) {
      const r = routes[f.properties.route_id];
      Object.assign(f.properties, { color: r.color, short_name: r.short_name, group: r.group, dest: niceDest(f.properties.headsign) });
      liveCounts[r.route_id] = (liveCounts[r.route_id] || 0) + 1;
    }
    lastBuses = data;

async function tempStopTimes(t) {
  const live = await GMTLive.tempStopTimes(t.id).catch(() => []); // [{trip, time}] predicted by Swiftly
  const liveByTrip = new Map(live.map((x) => [x.trip, x.time]));
  let base = [];
  if (t.refStop) try { base = ((await GMTLive.arrivals({ stop: t.refStop, only: [t.route] })).arrivals[t.refStop] || []).filter((a) => !t.trips || t.trips.has(a.trip)); } catch {}
  const out = base.map((a) => liveByTrip.has(a.trip) ? { headsign: a.headsign, time: liveByTrip.get(a.trip), live: true }
    : { headsign: a.headsign, time: a.time + t.travel, live: false });
  for (const x of live) if (!base.some((a) => a.trip === x.trip)) out.push({ headsign: "", time: x.time, live: true });
  const now = Date.now() / 1000;
  return out.filter((a) => a.time >= now - 30).sort((a, b) => a.time - b.time).slice(0, 3);
}

      (rs.length ? `<li class="q-head" role="presentation">Routes</li>` + rs.map(({ r }) => opt(`${chip(r)}<span class="q-name">${mark(r.long_name, q)}</span><span class="q-meta">Show on map</span>`, "q-route")).join("") : "") +
      (ss.length ? `<li class="q-head" role="presentation">Stops</li>` + ss.map(({ st }) => {
        const rr = st.routes.map((id) => routes[id]).filter(Boolean);
        return opt(`<span class="q-pin">${ICON.pin}</span><span class="q-name">${mark(st.name, q)}<span class="q-chips">${rr.slice(0, 6).map(chip).join("")}${rr.length > 6 ? `<span class="q-more">+${rr.length - 6}</span>` : ""}</span></span>`, "q-stop");
      }).join("") : "") +
      (ps.length ? `<li class="q-head" role="presentation">Addresses and places</li>` + ps.map((p) => opt(`<span class="q-pin">${ICON.place}</span><span class="q-name">${esc(p.label)}<span class="pl-sub">${esc(p.sub)}</span></span>`, "q-stop")).join("")
        : searching && items.length ? `<li class="q-empty" role="presentation">Searching addresses…</li>` : "");
    list.hidden = false; input.setAttribute("aria-expanded", "true"); sync();
  }
  function sync() {
    list.querySelectorAll("[role=option]").forEach((el) => el.setAttribute("aria-selected", +el.dataset.i === active));
    if (active >= 0) { input.setAttribute("aria-activedescendant", "q-" + active); list.querySelector(`#q-${active}`)?.scrollIntoView({ block: "nearest" }); }
    else input.removeAttribute("aria-activedescendant");
  }
  function close() { list.hidden = true; list.innerHTML = ""; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); items = []; active = -1; }
  function choose(i) {
    const it = items[i]; if (!it) return;
    input.value = ""; close(); input.blur();
    if (it.type === "place") { showNearby(it.c, `Near ${it.label}`, routeParam ? [routeParam] : null); return; }
    if (it.type === "stop") {
      const st = stopsById[it.id];
      if (!routeParam) {
        if (view === "frequency") setView("routes");
        hidden = new Set(Object.keys(routes).filter((x) => !st.routes.includes(x))); picking = true;
        buildSystemPanel.sync?.(); applyFilters(); refreshBuses();
        document.getElementById("announce").textContent = `Showing the ${st.routes.length} route${st.routes.length === 1 ? "" : "s"} that serve ${st.name}.`;
      }
      showStop(it.id, true);
    }
    else if (routeParam) location.search = routeLink(routes[it.id]).slice(1);
    else focusRoute(it.id);
  }
  input.addEventListener("input", render);
  input.addEventListener("focus", () => { if (input.value.trim()) render(); });
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && items.length) { active = (active + 1) % items.length; sync(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && items.length) { active = (active - 1 + items.length) % items.length; sync(); e.preventDefault(); }
    else if (e.key === "Enter") { if (active >= 0) choose(active); e.preventDefault(); }
    else if (e.key === "Escape") { input.value = ""; close(); }
  });
  list.addEventListener("mousedown", (e) => { const li = e.target.closest("[role=option]"); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
  list.addEventListener("mousemove", (e) => { const li = e.target.closest("[role=option]"); if (li && +li.dataset.i !== active) { active = +li.dataset.i; sync(); } });
}

// ---------- service text ----------
const DAY = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAYS_LONG = ["Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays", "Sundays"];
function daysLabel(d) {
  const k = d.map((x) => (x ? 1 : 0)).join("");
  if (k === "1111111") return "Daily";
  if (k === "1111110") return "Mon–Sat";
  if (k === "1111100") return "Weekdays";
  if (k === "0000011") return "Weekends";
  if (k === "0000000") return "No trips in the next two weeks";
  const on = d.map((x, i) => (x ? i : -1)).filter((i) => i >= 0);
  return on.length === 1 ? `${DAYS_LONG[on[0]]} only` : on.map((i) => DAY[i]).join(", ");
}
const mins = (x) => (x >= 120 && x % 60 === 0 ? `${x / 60} hr` : `${x} min`);
// "every 20 min peak, 30 min other times", from the build's time-of-day headways.
function phrase(d, detailed) {
  if (!d) return "";
  const p = d.periods || {}, peaks = [p.am, p.pm].filter(Boolean);
  const peak = peaks.length ? Math.min(...peaks) : null, base = p.mid || d.headway || peak, eve = p.eve;
  if (!base || (d.trips <= 10 && !p.mid)) return tripCounts(d);
  const lateService = d.last >= 19.5 * 3600;
  if (peak && !p.mid && !eve) return `${peak === 60 ? "hourly" : `every ${mins(peak)}`}, rush hours only`;
  let out;
  if (peak && peak < base) {
    if (eve && eve > base) out = `every ${peak} min peak, ${mins(base)} midday, ${mins(eve)} evenings`;
    else out = `every ${peak} min peak, ${mins(base)} other times`;
  } else {
    out = base === 60 ? "hourly" : `every ${mins(base)}`;
    if (eve && eve > base) out += `, ${mins(eve)} evenings`;
  }
  if (detailed && !lateService) out += ", no evening service";
  return out;
}
// "3 morning, 1 midday and 3 afternoon trips"
function tripCounts(d) {
  const parts = Object.entries(d.parts || {}).filter(([, n]) => n);
  if (!parts.length) return `${d.trips} trip${d.trips === 1 ? "" : "s"}`;
  const total = parts.reduce((s, [, n]) => s + n, 0);
  const list = parts.map(([k, n]) => `${n} ${k}`);
  const joined = list.length > 1 ? list.slice(0, -1).join(", ") + " and " + list[list.length - 1] : list[0];
  return `${joined} trip${total === 1 ? "" : "s"}`;
}
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
function freqText(r) {
  const s = r.service; if (!s) return "";
  const days = daysLabel(s.days);
  const main = s.weekday || s.saturday || s.sunday;
  if (!main) return days;
  const weekend = main === s.weekday && (s.days[5] || s.days[6]) && s.days.slice(0, 5).filter(Boolean).length > 1;
  return `${days} · ${weekend ? "weekdays " : ""}${phrase(main)}`;
}
function serviceTable(r) {
  const s = r.service; if (!s) return "";
  // e.g. "Every 20 min peak, 30 min other times" then "From Downtown Transit Center 6:00 AM–10:30 PM"
  const row = (label, d) => `<dt>${label}</dt><dd>${d ? `${cap(phrase(d, true))}${(d.dirs || []).map((x) =>
    `<span class="span-line">${clock(dayEpoch(x.first))}${x.trips > 1 ? `–${clock(dayEpoch(x.last))}` : ""} from ${esc(shortStop(x.from))}</span>`).join("")}` : "No service"}</dd>`;
  const wk = s.days.slice(0, 5);
  const onlyDays = s.weekday && wk.some(Boolean) && wk.filter(Boolean).length < 5 ? ` (${daysLabel([...wk, false, false])})` : "";
  return `<dl class="svc">${row("Weekdays" + onlyDays, s.weekday)}${row("Saturday", s.saturday)}${row("Sunday", s.sunday)}</dl>`;
}
const shortStop = (n) => n.replace(/^Downtown Transit Center.*$/i, "Downtown Transit Center").replace(/\s+(Bay|Berth)\s*\w*$/i, "");
const dayEpoch = (secs) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  return Math.floor(Date.now() / 1000) - (+p.hour * 3600 + +p.minute * 60 + +p.second) + secs;
};

// ---------- helpers ----------
function panel(html, fill) {
  const el = document.getElementById("panel"); el.innerHTML = html;
  el.classList.toggle("fit", !fill);
  const t = document.getElementById("toggle");
  if (t) t.onclick = () => { if (el._dragged) return; setSheet(!sheetOpen); };
  wireLiveToggle();
  document.getElementById("q")?.addEventListener("focus", () => { if (isPhone()) setSheet(true); });
  setSheet(sheetOpen);
}
// On phones the panel is a bottom sheet: collapsed shows the title and search; drag or tap to open it halfway or full.
function setSheet(open) {
  const head = document.querySelector("#panel header"); // keep the Expand button just above the collapsed sheet
  if (head) document.documentElement.style.setProperty("--sheet-collapsed", head.offsetHeight + 8 + "px");
  sheetOpen = open;
  const el = document.getElementById("panel"), t = document.getElementById("toggle");
  snapSheet(el, isPhone() ? (open ? "open" : "collapsed") : "open");
  if (t) { t.setAttribute("aria-expanded", String(open)); t.querySelector(".sr-only").textContent = open ? "Hide the list" : "Show the list"; }
}
function snapSheet(el, state) {
  if (!isPhone()) { el.style.height = ""; el.classList.remove("collapsed"); return; }
  const H = document.getElementById("wrap").clientHeight;
  if (el.id === "panel") { sheetState = state; sheetOpen = state !== "collapsed"; }
  el.classList.toggle("collapsed", state === "collapsed");
  el.style.height = state === "open" ? Math.round(H * 0.75) + "px" : ""; // open = bottom three-quarters; the top quarter stays map
  const t = el.querySelector("#toggle"); if (t) t.setAttribute("aria-expanded", String(state !== "collapsed"));
}
// Drag the top of a sheet up or down; it settles at the nearest height. Dragging the stop sheet low closes it.
let start_focusedSearch = false, startH = 0;
function draggable(el, handleSel) {
  let start = null;
  el.addEventListener("pointerdown", (e) => {
    if (!isPhone() || !e.target.closest(handleSel)) return;
    if (e.target.closest("input, a, [role=option], .sp-close, .viewtoggle")) return;
    start = { y: e.clientY, h: el.offsetHeight, moved: false };
    start_focusedSearch = document.activeElement?.id === "q";
  });
  addEventListener("pointermove", (e) => {
    if (!start) return;
    const dy = start.y - e.clientY;
    if (!start.moved && Math.abs(dy) < 6) return;
    start.moved = true;
    const H = document.getElementById("wrap").clientHeight;
    el.classList.remove("collapsed"); el.classList.add("dragging");
    el.style.height = Math.max(90, Math.min(H * 0.92, start.h + dy)) + "px";
  });
  const end = () => {
    if (!start) return;
    const moved = start.moved; startH = start.h; start = null;
    el.classList.remove("dragging");
    if (!moved) return;
    el._dragged = true; setTimeout(() => (el._dragged = false), 50);
    if (document.activeElement?.id === "q" && !start_focusedSearch) document.activeElement.blur(); // a drag isn't a tap on search
    // One swipe: up opens to three-quarters, down collapses (or closes the stop sheet).
    const up = el.offsetHeight > startH;
    if (el.id === "stop-panel") return up ? snapSheet(el, "open") : closeStop();
    snapSheet(el, up ? "open" : "collapsed");
  };
  addEventListener("pointerup", end); addEventListener("pointercancel", end);
}
draggable(document.getElementById("panel"), "header");
draggable(stopPanel, ".sp-head");
addEventListener("resize", () => { setSheet(sheetOpen); if (openStopId) snapSheet(stopPanel, "open"); });
// Status line plus the live-buses switch.
const statusRow = () => `<div class="status-row"><p class="status" id="status" aria-live="polite">${liveBusesOn ? "Loading buses…" : "Live buses are off"}</p>
  <label class="switch"><input type="checkbox" id="live-toggle" role="switch" ${liveBusesOn ? "checked" : ""}><span class="track" aria-hidden="true"></span>Live buses</label></div>`;
function wireLiveToggle() {
  const t = document.getElementById("live-toggle"); if (!t) return;
  t.onchange = () => {
    liveBusesOn = t.checked;
    try { localStorage.setItem("gmt-live-buses", liveBusesOn ? "on" : "off"); } catch {}
    applyFilters(); refreshBuses();
    document.getElementById("announce").textContent = liveBusesOn ? "Live buses on." : "Live buses off.";
  };
}
const toggleBtn = (label) => `<button id="toggle" aria-expanded="true"><span class="grip" aria-hidden="true"></span><span class="t-label">${label}</span><span class="sr-only">Show the list</span></button>`;
const chip = (r) => `<span class="chip" style="background:${esc(r.color || "#555")};color:${esc(r.text_color || "#fff")}">${esc(r.short_name || "")}</span>`;
function when(epoch) {
  const mins = Math.floor((epoch - Date.now() / 1000) / 60);
  if (mins < 1) return "Due";
  if (mins < 60) return `${mins} min`;
  return clock(epoch);
}
const clock = (epoch) => new Date(epoch * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
function fitTo(features, animate) {
  const b = new mapboxgl.LngLatBounds();
  features.forEach((f) => f.geometry.coordinates.forEach(([lon, lat]) => { if (lon > -75 && lon < -70 && lat > 42 && lat < 46) b.extend([lon, lat]); }));
  if (!b.isEmpty()) map.fitBounds(b, { padding: panelPad(), duration: animate && !reduceMotion ? 700 : 0 });
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

const svg = (d, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  food: svg('<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3.5 3.5-3.5 7 0 2 1 3 3.5 3"/>'),
  shop: svg('<path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/>'),
  restroom: svg('<circle cx="7" cy="4.5" r="1.8"/><circle cx="17" cy="4.5" r="1.8"/><path d="M5 8h4l-.6 6H8v6H6v-6h-.4zM15.2 8h3.6l1.7 7H19v5h-4v-5h-1.5z"/><rect x="11.4" y="3" width="1.2" height="18"/>', true),
  wheelchair: svg('<circle cx="11" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M11 7.5v6h5.5l2.5 5.5"/><path d="M8.5 10.5a5.5 5.5 0 1 0 6.9 7"/>'),
  shelter: svg('<path d="M3 9l9-5 9 5"/><path d="M5 8v12M19 8v12M8 15h8"/>'),
  seat: svg('<path d="M4 11h16M5 15h14M6 15v5M18 15v5M6 11V6M18 11V6"/>'),
  schedule: svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
  locate: svg('<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/>'),
  swap: svg('<path d="M8 4v14M8 4L4.5 7.5M8 4l3.5 3.5M16 20V6M16 20l-3.5-3.5M16 20l3.5-3.5"/>'),
  walk: svg('<circle cx="13" cy="4" r="1.8" fill="currentColor" stroke="none"/><path d="M10 21l2-6 2.5 2.5V21M8 12l2.5-4h3l2 3.5 2.5 1M12.5 8l-1 5"/>'),
  place: svg('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  warn: svg('<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  pin: svg('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  chevron: svg('<path d="M6 9l6 6 6-6"/>'),
  arrow: svg('<path d="M9 6l6 6-6 6"/>'),
  back: svg('<path d="M15 6l-6 6 6 6"/>').replace("<svg", '<svg width="14" height="14"'),
};

// Small chevron pointing along the line (">"), drawn at 2x; colored white on the map.
function chevronImage() {
  const S = 24, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  g.strokeStyle = "#000"; g.lineWidth = 4.6; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(7.5, 5.5); g.lineTo(15.5, 12); g.lineTo(7.5, 18.5); g.stroke();
  return { width: S, height: S, data: g.getImageData(0, 0, S, S).data };
}
// Route-colored badge with a bus pictogram and the route number, drawn at 2x for sharp screens.
function busBadge(r) {
  const k = 2, h = 24 * k, pad = 5 * k, icon = 14 * k, gap = 4 * k, radius = 7 * k, stroke = 2 * k;
  const font = `700 ${13 * k}px "Public Sans", system-ui, sans-serif`;
  const label = String(r.short_name || "");
  const m = document.createElement("canvas").getContext("2d"); m.font = font;
  const w = Math.ceil(pad + icon + (label ? gap + m.measureText(label).width : 0) + pad);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  const rr = (x, y, ww, hh, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + ww, y, x + ww, y + hh, rad);
    g.arcTo(x + ww, y + hh, x, y + hh, rad); g.arcTo(x, y + hh, x, y, rad); g.arcTo(x, y, x + ww, y, rad); g.closePath(); };
  rr(stroke / 2, stroke / 2, w - stroke, h - stroke, radius);
  g.fillStyle = r.color || "#555"; g.fill();
  g.lineWidth = stroke; g.strokeStyle = "#fff"; g.stroke();
  // bus pictogram (front view)
  const fg = r.text_color || "#fff", bx = pad, by = (h - icon) / 2, u = icon / 14;
  g.fillStyle = fg;
  rr(bx + 1 * u, by, 12 * u, 11.5 * u, 2.5 * u); g.fill();
  g.fillRect(bx + 2.5 * u, by + 11 * u, 2.5 * u, 3 * u); g.fillRect(bx + 9 * u, by + 11 * u, 2.5 * u, 3 * u);
  g.fillStyle = r.color || "#555";
  rr(bx + 2.5 * u, by + 2 * u, 9 * u, 5 * u, 1 * u); g.fill();
  g.beginPath(); g.arc(bx + 4 * u, by + 9.3 * u, 1 * u, 0, 7); g.arc(bx + 10 * u, by + 9.3 * u, 1 * u, 0, 7); g.fill();
  if (label) {
    g.fillStyle = fg; g.font = font; g.textBaseline = "middle";
    g.fillText(label, pad + icon + gap, h / 2 + 1 * k);
  }
  return { width: w, height: h, data: g.getImageData(0, 0, w, h).data };
}
