<!-- Overpass: an open-source take on Highway Gothic, the typeface of U.S. road signs, for a wayfinding feel. -->
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a22; --muted: #56655c; --faint: #66726a; /* 5:1 on white (WCAG AA) */ --panel: #fff; --line: #e1e7e3; --hover: #f1f5f2;
    --gmt: #00703c; --focus: #0b5cad; --live: #0a7d3b; --warn: #a3361b; --chip-bg: #eef3ef;
    --panel-w: 300px; --stop-w: 320px;
    font-family: "Overpass", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-feature-settings: "tnum" 1; /* times and counts line up in columns */
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  html, body { margin: 0; height: 100%; color: var(--ink); }
  #wrap { position: relative; height: 100%; min-height: 460px; overflow: hidden; }
  #map { position: absolute; top: 0; bottom: 0; left: var(--panel-w); right: 0; }
  #wrap.stop-open #map { right: var(--stop-w); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  button { font: inherit; color: inherit; }

  /* ---------- panel ---------- */
  #panel {
    position: absolute; top: 0; left: 0; bottom: 0; z-index: 2; width: var(--panel-w); box-sizing: border-box;
    display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow: hidden;
  }
  #panel header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  #panel h1 { font-size: 1.08rem; line-height: 1.3; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .status { font-size: .8rem; color: var(--muted); margin: 0; }
  .status.problem { color: var(--warn); }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { position: relative; width: 32px; height: 18px; border-radius: 4px; background: #c3ccc6; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + .track { background: var(--gmt); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; color: var(--gmt); font-weight: 600; text-decoration: none; margin-bottom: 8px; }
  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: .88rem; padding: 8px 10px 8px 32px;
    border: 1px solid #c9d3cc; border-radius: 4px; background: #fff; color: var(--ink); }
  .search > svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
  #panel header { position: relative; z-index: 3; }
  .search input::-webkit-search-cancel-button { cursor: pointer; }
  #q-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px 0; list-style: none; background: #fff;
    border-radius: 4px; box-shadow: 0 1px 3px rgba(20,30,25,.14), 0 0 0 1px rgba(20,30,25,.08); max-height: min(380px, 60vh); overflow-y: auto; z-index: 10; }
  #q-list .q-head { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 8px 12px 4px; }
  #q-list .q-empty { font-size: .84rem; color: var(--muted); padding: 10px 12px; }
  #q-list [role=option] { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: .87rem; }
  #q-list [role=option][aria-selected=true] { background: #e8f1ec; }
  #q-list mark { background: none; color: inherit; font-weight: 700; }
  .q-name { min-width: 0; line-height: 1.3; overflow-wrap: anywhere; }
  .q-meta { font-size: .72rem; color: var(--gmt); font-weight: 600; white-space: nowrap; }
  .q-stop { grid-template-columns: auto minmax(0, 1fr) !important; }
  .q-pin { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--chip-bg); color: var(--muted); }
  .q-pin svg { width: 16px; height: 16px; }
  .q-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .q-chips .chip { min-width: 1.7rem; font-size: .68rem; padding: 0 4px; }
  .q-more { font-size: .7rem; color: var(--muted); align-self: center; }
  .planner { padding: 12px 16px 16px; }
  .pl-fields { display: grid; gap: 8px; }
  .pl-field { position: relative; display: grid; grid-template-columns: 14px 1fr 36px; align-items: center; gap: 8px; }
  .pl-field input { font: inherit; font-size: .88rem; padding: 8px 10px; border: 1px solid #c9d3cc; border-radius: 4px; min-width: 0; color: var(--ink); }
  .pl-dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #c9d3cc; }
  .pl-dot.from { background: #0a7d3b; } .pl-dot.to { background: #c2410c; }
  .pl-me { width: 36px; height: 36px; border: 1px solid #c9d3cc; border-radius: 4px; background: #fff; color: var(--gmt); cursor: pointer; display: grid; place-items: center; }
  .pl-me svg { width: 18px; height: 18px; }
  .pl-list { position: absolute; left: 22px; right: 44px; top: calc(100% + 4px); z-index: 10; margin: 0; padding: 4px 0; list-style: none; background: #fff;
    border-radius: 4px; box-shadow: 0 1px 3px rgba(20,30,25,.14), 0 0 0 1px rgba(20,30,25,.08); max-height: 300px; overflow-y: auto; }
  .pl-list[hidden] { display: none; }
  .pl-list [role=option] { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: .86rem; }
  .pl-list [role=option][aria-selected=true] { background: #e8f1ec; }
  .pl-list .q-head { padding: 8px 12px 3px; font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pl-list .q-clear { padding: 4px 12px 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .pl-clear { background: none; border: 0; padding: 4px 0; font: inherit; font-size: .76rem; font-weight: 600; color: var(--gmt); cursor: pointer; }
  .pl-sub { display: block; font-size: .72rem; color: var(--muted); }
  .pl-when { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .pl-when select, .pl-when input { font: inherit; font-size: .86rem; padding: 7px 8px; border: 1px solid #c9d3cc; border-radius: 4px; background: #fff; color: var(--ink); }
  .pl-when select { min-width: 0; }
  .pl-timesel { display: inline-flex; align-items: center; gap: 3px; }
  .pl-timesel select { padding-left: 6px; padding-right: 4px; }
  .pl-timesel[hidden] { display: none; }
  .pl-inwrap { position: relative; flex: 1; min-width: 0; display: flex; } .pl-inwrap input { flex: 1; min-width: 0; padding-right: 30px !important; }
  .pl-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 50%; background: #e7ebe9; color: var(--ink);
    font-size: 1rem; line-height: 1; cursor: pointer; padding: 0; } .pl-x:hover { background: #d7ddda; } .pl-x[hidden] { display: none; }
  .pl-time[aria-invalid=true] { border-color: #c2410c; }
  .pl-time-msg { flex-basis: 100%; margin: 0; font-size: .74rem; color: #9a3412; }
  .pl-time-msg[hidden] { display: none; }
  @media (max-width: 640px) {
    #wrap #panel.plan-full { max-height: none; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); } /* beats the 92% cap on phone panels */
    .pl-list { max-height: 45vh; overscroll-behavior: contain; }
  }
  .pl-fastest { border-color: var(--live) !important; }
  .t-last { margin: 4px 0 0; font-size: .74rem; font-weight: 600; color: var(--ink); }
  .st-stay { display: block; margin: 2px 0; font-size: .74rem; font-weight: 700; color: var(--live); }
  .st-transfer { display: block; margin-bottom: 3px; font-size: .74rem; font-weight: 700; color: var(--live); } .st-transfer.tight { color: #b45309; }
  .st-livestat { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
  .st-livestat.live { color: var(--live); } .st-livestat .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
  #preview-bar { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 7; max-width: min(640px, calc(100% - 24px));
    background: #7c2d12; color: #fff; border-radius: 4px; padding: 7px 12px; font-size: .78rem; line-height: 1.35; box-shadow: 0 1px 3px rgba(0,0,0,.25); text-align: center; }
  @media (max-width: 640px) { #preview-bar { top: 52px; bottom: auto; } }
  .pl-climb { display: flex; gap: 6px; align-items: flex-start; margin: 0 12px 8px; font-size: .78rem; color: var(--live); font-weight: 600; } .pl-climb svg { width: 16px; height: 16px; flex: none; }
  .pl-sortnote { margin: 10px 0 0; font-size: .76rem; font-weight: 600; color: var(--ink); }
  .pl-fast-tag { font-size: .74rem; font-weight: 700; color: var(--live); }
  .pl-alt-ico { display: inline-flex; vertical-align: -3px; margin-right: 5px; color: var(--gmt); } .pl-alt-ico svg { width: 16px; height: 16px; }
  .pl-nextday { font-size: .74rem; font-weight: 600; color: #9a3412; }
  .pl-daynote { margin: 10px 0 0; font-size: .76rem; color: var(--muted); }
  .pl-go { margin-left: auto; border: 0; border-radius: 4px; background: var(--gmt); color: #fff; font-weight: 600; font-size: .88rem; padding: 8px 16px; cursor: pointer; }
  .pl-prefs { margin-top: 10px; display: grid; gap: 8px; }
  .pl-sort { display: flex; border: 1px solid #c9d3cc; border-radius: 4px; overflow: hidden; }
  /* Wording wraps onto two lines inside each button when the panel is narrow (e.g. a small embed), never overflowing. */
  .pl-sort button { flex: 1 1 0; min-width: 0; border: 0; border-left: 1px solid #c9d3cc; background: #fff; padding: 6px 4px; font: inherit; font-size: .78rem; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: normal; line-height: 1.2; overflow-wrap: normal; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 34px; }
  .pl-sort button:first-child { border-left: 0; }
  .pl-sort button[aria-checked=true] { background: var(--gmt); color: #fff; }
  .pl-acc { display: flex; align-items: center; gap: 7px; font-size: .82rem; cursor: pointer; }
  .pl-acc svg { width: 16px; height: 16px; color: #1f5fa8; }
  .pl-accnote { display: flex; align-items: center; gap: 5px; font-size: .74rem; color: #8a4b0f; } .pl-accnote.ok { color: var(--live); }
  .pl-accnote svg { width: 14px; height: 14px; flex: none; }
  .pl-cost { margin: 0 12px 12px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; background: #f7f9f8; font-size: .82rem; }
  .pl-cost p { margin: 0; } .pl-cost strong { color: var(--live); }
  .pl-mappick { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 8px; border: 0; background: none; padding: 4px 0; font: inherit; font-size: .8rem; font-weight: 700; color: var(--gmt); cursor: pointer; }
  .pl-mappick svg { width: 15px; height: 15px; } .pl-mappick:hover { text-decoration: underline; }
  .pl-results-sort { margin-top: 10px; }
  #pl-results .pl-sort { margin-top: 10px; }
  .pl-two-weeks { margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: .8rem; }
  .pl-two-weeks p { margin: 0; } .pl-two-weeks strong { color: var(--live); }
  .pl-tw-sub { margin-top: 2px !important; font-size: .72rem; color: var(--muted); } .pl-tw-sub strong { color: var(--ink); }
  .pl-frequent { margin-top: 5px !important; padding-top: 5px; border-top: 1px dashed var(--line); } .pl-frequent a { color: var(--gmt); font-weight: 600; }
  .pl-cost-sub { margin-top: 2px !important; font-size: .74rem; color: var(--muted); }
  .pl-why { margin-left: 6px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #9aa7a0; background: #fff; color: var(--muted); font: 700 .7rem/1 inherit; cursor: pointer; vertical-align: 1px; padding: 0; }
  .pl-why[aria-expanded=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pl-why-box { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .76rem; line-height: 1.45; color: var(--ink); }
  .pl-why-box ul { margin: 6px 0; padding-left: 16px; } .pl-why-box li { margin: 2px 0; }
  .pl-opts { list-style: none; margin: 10px 0 8px; padding: 0; display: grid; gap: 8px; }
  .pl-opt { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .pl-opt.open { border-color: #9fb8a8; box-shadow: 0 1px 3px rgba(20,30,25,.14), 0 0 0 1px rgba(20,30,25,.08); }
  .pl-card { width: 100%; display: grid; gap: 6px; text-align: left; background: #fff; border: 0; padding: 10px 12px; cursor: pointer; font: inherit; }
  .pl-card.static { cursor: default; }
  .pl-opt.open .pl-card { background: #f3f7f4; }
  .pl-times { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; } .pl-times span { color: var(--muted); font-size: .82rem; }
  .pl-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .pl-walk { display: inline-flex; align-items: center; gap: 1px; font-size: .74rem; color: var(--muted); } .pl-walk svg { width: 15px; height: 15px; }
  .pl-sep { color: var(--faint); font-size: .8rem; }
  .pl-meta { font-size: .76rem; color: var(--muted); }
  .pl-live { margin: 0; } .pl-live:empty { display: none; }
  .pl-steps { list-style: none; margin: 0; padding: 4px 12px 12px; display: grid; gap: 10px; font-size: .82rem; }
  .pl-steps li { display: grid; grid-template-columns: 38px 1fr; gap: 8px; align-items: start; line-height: 1.4; }
  .st-ico { display: grid; place-items: center; color: var(--muted); } .st-ico svg { width: 18px; height: 18px; }
  .st-sub { display: block; color: var(--muted); font-size: .76rem; }
  .viewtoggle { display: flex; margin: 10px -16px 0; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .viewtoggle button { white-space: nowrap; font-size: .8rem !important; padding: 6px 4px !important; }
  .viewtoggle button { flex: 1; border: 0; background: none; border-radius: 0; padding: 9px 4px 8px; font-size: .84rem; font-weight: 600; cursor: pointer; color: var(--muted);
    border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .viewtoggle button:hover { color: var(--ink); }
  .viewtoggle button[aria-pressed=true] { color: var(--ink); font-weight: 700; border-bottom-color: var(--gmt); box-shadow: none; }
  .freq-legend { padding: 14px 16px; }
  .periods { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .periods button { border: 1px solid #c9d3cc; background: #fff; border-radius: 4px; padding: 5px 11px; font-size: .8rem; cursor: pointer; color: var(--ink); }
  .periods button[aria-checked=true] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .tiers li { display: block !important; }
  .tiers button { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 4px; padding: 7px 8px; cursor: pointer; font-size: .88rem; }
  .tiers button:hover { background: var(--hover); }
  .tiers button[aria-pressed=false] { color: var(--faint); } .tiers button[aria-pressed=false] .swatch { opacity: .25; }
  .tiers .tick { width: 18px; height: 18px; color: var(--gmt); } .tiers .tick svg { width: 18px; height: 18px; }
  .tiers button[aria-pressed=false] .tick { visibility: hidden; }
  .see-all { display: block; width: 100%; margin: -2px 0 10px; padding: 7px; border: 1px solid #c9d3cc; background: #fff; border-radius: 4px; font-size: .8rem; font-weight: 600; color: var(--gmt); cursor: pointer; }
  .see-all:hover { background: var(--hover); }
  .alltimes { max-height: 220px; overflow-y: auto; margin: -4px 0 4px; padding-right: 4px; }
  .at-group { padding: 6px 0; border-top: 1px solid var(--line); } .at-group:first-child { border-top: 0; }
  .at-head { margin: 0 0 4px; font-size: .8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .at-times { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .at-times .past { color: #b3bcb6; } .at-times .next { font-weight: 700; } .at-times .live { color: var(--live); }
  .svc dd .span-line { display: block; font-size: .76rem; color: var(--muted); }
  .freq-intro { font-size: .86rem; line-height: 1.45; margin: 0 0 12px; }
  .freq-legend ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
  .freq-legend li { display: flex; align-items: center; gap: 12px; font-size: .88rem; }
  .swatch { width: 36px; height: var(--w); background: var(--c); border-radius: 4px; flex: none; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px #e1e7e3; }
  .swatch.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 11px); box-shadow: none; }
  .freq-note { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 0; }
  .scroll { overflow-y: auto; overflow-x: hidden; flex: 1; overscroll-behavior: contain; }

  /* legend groups */
  .group { border-bottom: 1px solid var(--line); }
  .group-head { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 0 16px; background: #f6f7f6; border-bottom: 1px solid var(--line); }
  .group-toggle { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 11px 0; cursor: pointer;
    font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #3f4a44; text-align: left; }
  .group-toggle .count { font-weight: 600; color: var(--faint); letter-spacing: 0; }

  .rows { list-style: none; margin: 0; padding: 0 0 6px; }
  .rows[hidden] { display: none; }
  .route-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px 7px 16px; border-top: 1px solid #eef1ef; }
  .route-row:first-child { border-top: 0; }
  .route-row:hover, .route-row.hl { background: var(--hover); }
  .route-row label { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; cursor: pointer; min-width: 0; }
  .rname { font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
  .rfreq { grid-column: 2; font-size: .76rem; color: var(--muted); line-height: 1.3; }
  .rfreq .lv { color: var(--live); font-weight: 600; }
  .route-go { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; color: var(--gmt); text-decoration: none; }
  .route-go:hover { background: #e3eee7; }
  .route-go svg { width: 18px; height: 18px; }
  input[type=checkbox] { accent-color: var(--gmt); margin: 0; width: 16px; height: 16px; }

  /* Unselected routes keep their route color (many riders know routes by color); the cleared checkbox and grayer name show they're off. */
  .route-row.off .rname { color: var(--muted); }

  .chip { display: inline-block; min-width: 2.3rem; text-align: center; border-radius: 2px; font-weight: 800; font-size: .8rem; padding: 3px 5px 2px; box-sizing: border-box; line-height: 1.3; letter-spacing: .01em; }

// Mapbox Search Box finds places (City Hall, hospitals, schools, businesses) as well as addresses and towns.
// Results are limited to Vermont: the search covers Vermont's area, and anything outside Vermont is dropped.
// If Search Box ever fails, it falls back to Mapbox's address search.
// GMT's service area: Chittenden, Washington and Franklin counties, Vermont. The search covers that area, and
// results outside those counties are dropped (by the county Mapbox reports, or by location if it doesn't say).
const VT_BBOX = "-73.45,44.05,-72.2,45.02";

  const r = ctx?.region; if (!(r && (r.region_code === "VT" || r.region_code === "US-VT" || /vermont/i.test(r.name || "")))) return false;
  const county = ctx?.district?.name;
  if (county) return SERVICE_COUNTIES.test(county.trim());
  return !c || (c[0] >= -73.45 && c[0] <= -72.2 && c[1] >= 44.05 && c[1] <= 45.02);
};
// Chittenden County results first (GMT's core service area), then Washington and Franklin, keeping Mapbox's order otherwise.
const inChittenden = (ctx, c) => { const county = ctx?.district?.name; if (county) return /^chittenden/i.test(county.trim());
  return !!c && c[0] >= -73.45 && c[0] <= -72.85 && c[1] >= 44.25 && c[1] <= 44.70; };

    const url = `https://api.mapbox.com/search/searchbox/v1/forward?q=${encodeURIComponent(q)}&proximity=${near}&bbox=${VT_BBOX}&country=US&language=en`
      + `&types=poi,address,place,street,neighborhood,locality&auto_complete=true&limit=10&access_token=${MAPBOX_TOKEN}`;
    const res = await fetch(url); if (!res.ok) throw new Error(res.status);

      const res = await (await fetch(url)).json();

    } catch { return []; }

// ---------- ridership (from GMT's ArcGIS Online stops data, summarized nightly) ----------
const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

// Trends for the chosen range: net and % change (first month vs. last), the overall direction from a

function fitSlope(vals) {

}
// Trend = the months in the range compared with the SAME months a year earlier (so seasons such as summer

function trendsHtml(total, months, rangeText, sr, from) {
  const signed = (n) => `${n > 0 ? "+" : n < 0 ? "−" : ""}${fmtN(Math.abs(n))}`;
  const pctOf = (a, b) => (a ? ((b - a) / a) * 100 : null);
  const pctText = (p) => (p == null ? "–" : `${p > 0 ? "+" : p < 0 ? "−" : ""}${Math.abs(p).toFixed(1)}%`);
  const tone = (n) => (n > 0 ? "up" : n < 0 ? "down" : "");
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  const all = sr.total, n = all.length;
  let cur, prev, basis;

  else { cur = total; prev = from >= 12 ? all.slice(from - 12, from - 12 + total.length) : null; basis = "vs. the same months a year earlier"; }
  let direction, detail, cls;
  if (prev && sum(prev) > 0) {

    direction = total.length < 3 ? "Not enough data" : steady ? "Steady" : slope > 0 ? "Growing" : "Declining";
    detail = total.length < 3 ? "" : `${steady ? "about flat" : `${signed(Math.round(slope))} a month`} (no earlier year to compare; seasons may affect this)`;
    cls = steady ? "" : tone(slope);

      <p class="rd-h">Trends, ${rangeText}</p>
      <dl class="rd-rows">
        <div><dt>Net ${net >= 0 ? "growth" : "decline"}</dt><dd class="${tone(net)}">${signed(net)}</dd><p title="${monthLabel(months[0], true)} to ${monthLabel(months[months.length - 1], true)}">${monthLabel(months[0], true)} to ${monthLabel(months[months.length - 1], true)}</p></div>
        <div><dt>Change</dt><dd class="${tone(net)}">${pctText(pct)}</dd><p title="First month shown to last">First month shown to last</p></div>
        <div><dt>Trend</dt><dd class="${cls}">${direction}</dd><p title="${esc(detail)}">${detail}</p></div>
      </dl>
      ${yoyMonth != null ? `<p class="rd-yoy">${monthLabel(all.length ? sr.months[n - 1] : "", true)} compared with a year earlier (${monthLabel(sr.months[n - 13], true)}): <b class="${tone(yoyMonth)}">${pctText(yoyMonth)}</b></p>` : ""}
      <p class="rd-note">Net growth and change compare the first and last months shown, so a seasonal month (like September near campus) can swing them. The trend compares like months with like, so seasons cancel out.</p>
    </div>`;
}
// Stock-style chart of the stop's total boardings: big number for the latest (or scrubbed) month, change

function wireRidership(root, s) {
  const box = root.querySelector("#rider-box"); if (!box || box.dataset.wired) return;
  box.dataset.wired = "1";

  const sr = riderSeries(s), graph = box.querySelector(".rd-graph");
  const RANGES = [["6M", "past 6 months"], ["YTD", "year to date"], ["12M", "past 12 months"], ["All", "all time"]];
  const draw = () => {
    const n = sr.months.length, latestYear = sr.months[n - 1].slice(0, 4);
    const start = riderRange === "6M" ? n - 6 : riderRange === "12M" ? n - 12 : riderRange === "YTD" ? sr.months.findIndex((m) => m.startsWith(latestYear)) : 0;
    const from = Math.max(0, start), months = sr.months.slice(from), total = sr.total.slice(from), m = months.length;
    const first = total[0], last = total[m - 1], diff = last - first, pct = first ? (diff / first) * 100 : 0;
    const up = diff >= 0, trend = up ? "#0a8a3e" : "#c2410c", rangeText = RANGES.find((r) => r[0] === riderRange)[1];
    // Like a stock chart, the vertical scale runs from the lowest to the highest month shown.
    const W = 320, H = 130, P = 10, lo = Math.min(...total), hi = Math.max(...total), span = Math.max(1, hi - lo);
    const X = (i) => (m === 1 ? W / 2 : P + (i / (m - 1)) * (W - 2 * P)), Y = (v) => H - P - ((v - lo) / span) * (H - 2 * P);
    const path = total.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    graph.innerHTML = `
      <div class="rd-head"><strong class="rd-big">${fmtN(last)}</strong>
        <span class="rd-when">boardings in ${monthLabel(months[m - 1])}</span>
        <span class="rd-chg" style="color:${trend}">${up ? "▲" : "▼"} ${fmtN(Math.abs(diff))} (${Math.abs(pct).toFixed(1)}%) <span>${rangeText}</span></span></div>
      <svg class="rd-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly boardings at this stop, ${rangeText}: from ${fmtN(first)} in ${monthLabel(months[0])} to ${fmtN(last)} in ${monthLabel(months[m - 1])}">
        <line x1="${P}" x2="${W - P}" y1="${Y(first)}" y2="${Y(first)}" class="rd-base"/>
        <path d="${path}" stroke="${trend}" class="rd-path"/>
        <line class="rd-cursor" y1="0" y2="${H}" x1="0" x2="0" visibility="hidden"/>
        <circle class="rd-dot" r="4" cx="0" cy="0" fill="${trend}" visibility="hidden"/>
        <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
      </svg>
      <div class="rd-axis"><span>${monthLabel(months[0], true)}</span><span>${monthLabel(months[m - 1], true)}</span></div>
      <div class="rd-ranges" role="group" aria-label="Time range">${RANGES.map(([k]) =>
        `<button type="button" data-range="${k}" aria-pressed="${k === riderRange}" style="--tc:${trend}">${k}</button>`).join("")}</div>
      ${trendsHtml(total, months, rangeText, sr, from)}`;
    // Keep the average tile in step with the range too.
    const avgEl = box.querySelector(".rd-avg"), avgLabel = box.querySelector(".rd-avg-label");
    if (avgEl) avgEl.textContent = fmtN(total.reduce((a, b) => a + b, 0) / m);
    if (avgLabel) avgLabel.textContent = `boardings a month at this stop, average ${rangeText}`;
    // Scrub: move across the chart to read any month, then it springs back to the latest.
    const svgEl = graph.querySelector("svg"), big = graph.querySelector(".rd-big"), whenEl = graph.querySelector(".rd-when");
    const cursor = graph.querySelector(".rd-cursor"), dot = graph.querySelector(".rd-dot");
    const show = (i) => {

      cursor.setAttribute("x1", X(i)); cursor.setAttribute("x2", X(i)); cursor.setAttribute("visibility", "visible");
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(total[i])); dot.setAttribute("visibility", "visible");
    };
    const reset = () => { show(m - 1); cursor.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
    const move = (e) => {
      const r = svgEl.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * W;
      show(Math.max(0, Math.min(m - 1, Math.round(((x - P) / (W - 2 * P)) * (m - 1)))));
    };
    svgEl.addEventListener("pointermove", move); svgEl.addEventListener("pointerdown", move);
    svgEl.addEventListener("pointerleave", reset); svgEl.addEventListener("pointerup", (e) => e.pointerType !== "mouse" && reset());
    graph.querySelectorAll("[data-range]").forEach((b) => (b.onclick = () => { riderRange = b.dataset.range; draw(); }));
  };
  draw();
}

// Camera marker: a small wedge pointing the way the Street View photo looks, with a dot at the camera.
// A map pin: a teardrop in the given color with a white circle and a word (START / FINISH), drawn at 2x.
function pinImage(word, color) {
  const W = 76, H = 96, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), cx = W / 2, cy = 36, R = 33;

// ---------- search: routes and stops ----------
function searchBox(withRoutes, stopIds) {
  const stopPool = (stopIds ? stopIds.map((id) => stopsById[id]) : Object.values(stopsById)).filter(Boolean);
  const routePool = withRoutes ? Object.values(routes) : [];
  queueMicrotask(() => wireSearch(routePool, stopPool));
  const ph = withRoutes ? "Search routes, stops or places" : "Search a stop or an address";
  return `<div class="search">${ICON.search}<label for="q" class="sr-only">${ph}</label>
    <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="q-list" placeholder="${ph}" autocomplete="off" spellcheck="false">
    <ul id="q-list" role="listbox" aria-label="Search results" hidden></ul></div>`;
}
function wireSearch(routePool, stopPool) {
  const input = document.getElementById("q"), list = document.getElementById("q-list");
  if (!input) return;
  let items = [], active = -1, places = [], placeQ = "", placeSeq = 0, placeTimer = null, placePending = false;
  const findAddresses = true; // also search places and addresses (Chittenden, Washington and Franklin counties), showing the nearest service
  const norm = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]+/g, " ");
  const mark = (text, q) => {
    const i = norm(text).indexOf(q);
    return i < 0 || !q ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  };
  const score = (name, q) => { const n = norm(name); if (n.startsWith(q)) return 0; if (n.includes(" " + q)) return 1; return n.includes(q) ? 2 : null; };
  function render() {
    const raw = input.value.trim(), q = norm(raw).trim().replace(/^route /, "");
    if (!q) { close(); return; }
    const rs = routePool.map((r) => ({ r, s: r.short_name.toLowerCase() === q ? -1 : r.short_name.toLowerCase().startsWith(q) ? 0 : score(r.long_name, q) }))
      .filter((x) => x.s != null).sort((a, b) => a.s - b.s || a.r.sort - b.r.sort).slice(0, 5);
    const ss = stopPool.map((st) => ({ st, s: score(st.name, q) })).filter((x) => x.s != null)
      .sort((a, b) => a.s - b.s || a.st.name.localeCompare(b.st.name)).slice(0, 8);
    // Addresses: looked up after a short pause; until they come back, say "Searching" rather than "No matches".
    if (findAddresses && raw.length >= 3 && raw !== placeQ) {
      placeQ = raw; placePending = true; places = []; const mine = ++placeSeq;
      clearTimeout(placeTimer);
      placeTimer = setTimeout(async () => {
        try {
          const found = await searchPlaces(raw, 5);
          if (mine !== placeSeq) return;
          places = found;
        } catch { places = []; }
        if (mine === placeSeq) { placePending = false; if (document.activeElement === input) render(); }
      }, 250);
    }
    const ps = findAddresses && raw === placeQ ? places : [];
    items = [...rs.map((x) => ({ type: "route", id: x.r.route_id })), ...ss.map((x) => ({ type: "stop", id: x.st.stop_id })), ...ps.map((p) => ({ type: "place", ...p }))];
    active = items.length ? 0 : -1;
    let n = 0;
    const opt = (inner, cls) => `<li role="option" id="q-${n}" class="${cls}" data-i="${n}" aria-selected="${n++ === active}">${inner}</li>`;
    const searching = findAddresses && placePending && raw.length >= 3;
    list.innerHTML = (!items.length ? `<li class="q-empty" role="presentation">${searching ? "Searching…" : `No ${routeParam ? "stops or addresses" : "routes, stops or places"} match “${esc(raw)}”`}</li>` : "") +
      (rs.length ? `<li class="q-head" role="presentation">Routes</li>` + rs.map(({ r }) => opt(`${chip(r)}<span class="q-name">${mark(r.long_name, q)}</span><span class="q-meta">Show on map</span>`, "q-route")).join("") : "") +
      (ss.length ? `<li class="q-head" role="presentation">Stops</li>` + ss.map(({ st }) => {
        const rr = st.routes.map((id) => routes[id]).filter(Boolean);
        return opt(`<span class="q-pin">${ICON.pin}</span><span class="q-name">${mark(st.name, q)}<span class="q-chips">${rr.slice(0, 6).map(chip).join("")}${rr.length > 6 ? `<span class="q-more">+${rr.length - 6}</span>` : ""}</span></span>`, "q-stop");
      }).join("") : "") +
      (ps.length ? `<li class="q-head" role="presentation">Places and addresses</li>` + ps.map((p) => opt(`<span class="q-pin">${p.poi ? ICON.landmark : ICON.place}</span><span class="q-name">${esc(p.label)}<span class="pl-sub">${esc(p.sub)}</span></span>`, "q-stop")).join("")
        : searching && items.length ? `<li class="q-empty" role="presentation">Searching addresses…</li>` : "");
    list.hidden = false; input.setAttribute("aria-expanded", "true"); sync();
  }
  function sync() {
    list.querySelectorAll("[role=option]").forEach((el) => el.setAttribute("aria-selected", +el.dataset.i === active));
    if (active >= 0) { input.setAttribute("aria-activedescendant", "q-" + active); list.querySelector(`#q-${active}`)?.scrollIntoView({ block: "nearest" }); }
    else input.removeAttribute("aria-activedescendant");
  }
  function close() { list.hidden = true; list.innerHTML = ""; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); items = []; active = -1; }

    if (it.type === "stop") {
      const st = stopsById[it.id];
      if (!routeParam) {
        if (view === "frequency") setView("routes");
        hidden = new Set(Object.keys(routes).filter((x) => !st.routes.includes(x))); picking = true;
        buildSystemPanel.sync?.(); applyFilters(); refreshBuses();
        document.getElementById("announce").textContent = `Showing the ${st.routes.length} route${st.routes.length === 1 ? "" : "s"} that serve ${st.name}.`;
      }

  input.addEventListener("input", render);
  input.addEventListener("focus", () => { if (input.value.trim()) render(); });

    if (e.key === "ArrowDown" && items.length) { active = (active + 1) % items.length; sync(); e.preventDefault(); }

  list.addEventListener("mousemove", (e) => { const li = e.target.closest("[role=option]"); if (li && +li.dataset.i !== active) { active = +li.dataset.i; sync(); } });
}

// ---------- service text ----------
const DAY = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAYS_LONG = ["Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays", "Sundays"];
function daysLabel(d) {
  const k = d.map((x) => (x ? 1 : 0)).join("");

function swipeAnywhere(el, handleSel, scrollSel) {
  let t = null;
  el.addEventListener("touchstart", (e) => {
    if (!isPhone() || e.touches.length !== 1 || e.target.closest(handleSel)) return; // the top bar has its own drag
    if (e.target.closest("input, textarea, select, [role=option], .pl-list, .rd-line")) return;
    t = { x: e.touches[0].clientX, y: e.touches[0].clientY, h: el.offsetHeight, sc: e.target.closest(scrollSel), take: null };
  }, { passive: true });
