# Cloudflare Worker: the GMT live map relay (src/worker.js).
# "name" must match the Worker's name in the Cloudflare dashboard (Workers & Pages).
name = "gmt-system-map"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Keep any variables added in the Cloudflare dashboard when this file deploys (secrets such as
# SWIFTLY_KEY are always kept).
keep_vars = true

[vars]
# Seconds between bus-location refreshes from Swiftly. 5 = smoother bus movement: about 255 Swiftly
# requests per 15 minutes per Cloudflare location, within GMT's 1,000-per-15-minutes limit.
# Remove this line (or set "15") to go back to the default.
VEHICLES_TTL = "5"
