# Rebuilds the map data from GMT's published GTFS every night and publishes the site.
# Also runs when map files change, or by hand (Actions tab -> Build map data and publish -> Run workflow).
# If the GTFS is missing, broken, expired or only covers future dates, the build stops and the
# current site stays up; GitHub emails the repo admins about the failed run.
name: Build map data and publish

on:
  schedule:
    - cron: "15 8 * * *"   # 4:15 AM Eastern (daylight time), before morning service
  push:
    branches: [main]
    paths: ["amenities.csv", "route-info.json", "scripts/**", "public/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      gtfs_url:
        description: "Optional, for testing: a different GTFS .zip link (for example an older feed). Leave blank for GMT's current feed."
        required: false
        default: ""
      build_date:
        description: "Optional, for testing: build as if it were this date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      test_only:
        description: "Test only: build the feed above as a PREVIEW at .../system-map/?preview=1; the live map stays on GMT's current feed."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to restore the latest preview (from the last "Test only" run) when publishing

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # GMT's GTFS, published by Trillium. This is the ONLY place the link appears: if Trillium moves it, change it here.
  CURRENT_GTFS: http://data.trilliumtransit.com/gtfs/ccta-vt-us/ccta-vt-us.zip
  GTFS_URL: ${{ github.event.inputs.gtfs_url }}   # a test feed from the Run workflow form (blank = GMT's current feed)
  TEST_ONLY: ${{ inputs.test_only }}
  BUILD_DATE: ${{ github.event.inputs.build_date }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # long-term support release (Node.js 20 reached end of life in April 2026)
      - name: Validate staff-editable content
        run: |
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("route-info.json","utf8")); if(!c.routes || typeof c.routes!=="object") throw Error("Missing routes in route-info.json"); for(const [id,desc] of Object.entries(c.routes)) if(typeof desc!=="string") throw Error(`Route ${id}: description must be text`); console.log("route-info.json valid");'
      - name: Download GTFS
        run: |
          get() { # get URL FOLDER VARIABLE: download a feed and note the folder that holds routes.txt
            echo "Downloading $1"
            curl -fsSL --retry 3 --retry-delay 30 "$1" -o "$2.zip"
            unzip -q -o "$2.zip" -d "$2"
            echo "$3=$(dirname "$(find "$2" -name routes.txt | head -1)")" >> "$GITHUB_ENV"
          }
          GTFS_URL="${GTFS_URL:-$CURRENT_GTFS}"; echo "GTFS_URL=$GTFS_URL" >> "$GITHUB_ENV"   # blank form = GMT's current feed
          if [ "$TEST_ONLY" = "true" ]; then
            get "$GTFS_URL" gtfs_test TEST_DIR      # the test feed, for the preview
            get "$CURRENT_GTFS" gtfs GTFS_DIR       # GMT's current feed, for the live map as usual
          else
            get "$GTFS_URL" gtfs GTFS_DIR
          fi
      - name: Build data
        run: |
          set -o pipefail
          build() { if [ -f amenities.csv ]; then node scripts/build-data.mjs "$1" amenities.csv; else node scripts/build-data.mjs "$1"; fi; }
          if [ "$TEST_ONLY" = "true" ]; then
            # 1. The preview, from the test feed, as of the test date (BUILD_DATE). If it fails, nothing is published.
            PREVIEW_FEED="$GTFS_URL" build "$TEST_DIR" 2>&1 | tee build.log
            mkdir -p public/preview && rm -rf public/preview/data && mv public/data public/preview/data && mkdir -p public/data
            # 2. The live map, from GMT's current feed, as of today -- exactly as a normal run.
            BUILD_DATE= build "$GTFS_DIR" 2>&1 | tee build-live.log
          else
            build "$GTFS_DIR" 2>&1 | tee build.log
          fi
      - name: Keep the current preview (from the last "Test only" run)
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=preview-site&per_page=20" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' || true)
          if [ -n "$id" ]; then
            gh run download "$id" --repo "${{ github.repository }}" -n preview-site -D public/preview && echo "Preview restored from run $id." || echo "Couldn't restore the preview; publishing without it."
          else
            echo "No preview to keep."
          fi
      - name: Summary on the run's page
        if: always()
        run: |
          {
            if [ "${{ inputs.test_only }}" = "true" ]; then echo "## Test build: preview of a test feed"; else echo "## Map build"; fi
            echo ""
            echo "- **Feed:** $GTFS_URL"
            [ -n "$BUILD_DATE" ] && echo "- **Built as if it were:** $BUILD_DATE"
            [ -f gtfs/feed_info.txt ] && echo "- **feed_info.txt:** $(sed -n 2p "$(find gtfs -name feed_info.txt | head -1)")"
            echo ""
            grep -E "Feed covers|Built [0-9]+ routes|Frequency map by route|Frequency map uses|Ridership:|Amenities:|::warning::|::error::|Error:" build.log 2>/dev/null | sed -E 's/^::(warning|error)::/**\1:** /; s/^/- /'
            if [ "${{ inputs.test_only }}" = "true" ]; then
              echo ""
              echo "**Preview:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?preview=1 (the live map stays on GMT's current feed)."
              echo "The preview's data and build logs are also under **test-map-data** in Artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Add keys from the repository secrets
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          SWIFTLY_KEY: ${{ secrets.SWIFTLY_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "public/index.html";
            let html = fs.readFileSync(f, "utf8");
            const add = (secret, placeholder, without) => {
              const key = process.env[secret] || "";
              if (!key) return console.log(`No ${secret} secret set: ${without}.`);
              html = html.replace(placeholder, key); console.log(`${secret} added.`);
            };
            if (!process.env.MAPBOX_TOKEN) { console.log("::error::No MAPBOX_TOKEN secret set. The map cannot show without it, so nothing was published; the current site stays up."); process.exit(1); }
            add("MAPBOX_TOKEN", "__MAPBOX_TOKEN__", "");
            // With the relay, live data comes through it and the Swiftly key is NOT put in the page.
            if (process.env.RELAY_URL) { add("RELAY_URL", "__RELAY_URL__", ""); console.log("Using the relay; the Swiftly key stays private."); }
            else add("SWIFTLY_KEY", "__SWIFTLY_KEY__", "publishing without live buses");
            add("GOOGLE_MAPS_KEY", "__GOOGLE_KEY__", "Street View opens as a link to Google Maps instead of inside the panel");
            fs.writeFileSync(f, html);'
      - name: Save the preview (nightly builds restore it until the next test)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: public/preview
          retention-days: 90
      - name: Save the test build's data and logs
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: test-map-data
          path: |
            public/preview/data
            build.log
            build-live.log
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Failure alerts for everyone: if the build or the publish step fails, open a "Map update failed" issue (or comment on
  # the one already open), which emails everyone watching the repository. When a later run succeeds, close it.
  notify:
    needs: [build, deploy]
    if: ${{ always() && !inputs.test_only }}   # test runs don't open or close failure issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the "Map update failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          title="Map update failed"
          when="$(TZ=America/New_York date '+%B %-d, %Y at %-I:%M %p') Eastern"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$BUILD" = "failure" ] || [ "$DEPLOY" = "failure" ]; then
            step=$([ "$BUILD" = "failure" ] && echo "building the map data" || echo "publishing to GitHub Pages")
            body="The map's automatic update failed while **$step** on $when (run started by: $TRIGGER).

          **The live map is still up**, showing the last data that built successfully.

          - What went wrong: open the run, then the step with the red X, and read the last lines of its log: $RUN_URL
          - Common causes and fixes are in MAINTENANCE.md (for example, the GTFS feed has expired or GMT's feed URL changed).
          - This issue closes itself the next time the map updates successfully."
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          elif [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Fixed: the map updated successfully on $when. $RUN_URL"
          fi

  # GitHub switches off scheduled workflows in public repos after 60 days with no repository activity.
  # If nothing has been committed for 45 days, this adds an empty commit so the nightly updates never stop.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Keep the nightly schedule active
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep nightly map updates active"
            git push
          fi
