# Rebuilds the map data from GMT's published GTFS every night and publishes the site.
# Also runs when map files change, or by hand (Actions tab -> Build map data and publish -> Run workflow).
# If the GTFS is missing, broken, expired or only covers future dates, the build stops and the
# current site stays up; GitHub emails the repo admins about the failed run.
name: Build map data and publish

on:
  schedule:
    - cron: "15 8 * * *"   # 4:15 AM Eastern (daylight time), before morning service
  push:
    branches: [main]
    paths: ["amenities.csv", "route-info.json", "scripts/**", "public/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      gtfs_url:
        description: "Optional, for testing: a different GTFS .zip link (for example an older feed). Leave blank for GMT's current feed."
        required: false
        default: ""
      build_date:
        description: "Optional, for testing: build as if it were this date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GTFS_URL: ${{ github.event.inputs.gtfs_url || 'http://data.trilliumtransit.com/gtfs/ccta-vt-us/ccta-vt-us.zip' }}   # GMT GTFS, published by Trillium
  BUILD_DATE: ${{ github.event.inputs.build_date }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download GTFS
        run: |
          echo "Using $GTFS_URL"
          curl -fsSL --retry 3 --retry-delay 30 "$GTFS_URL" -o gtfs.zip
          unzip -q -o gtfs.zip -d gtfs
          # Some zips put the files in a subfolder; use whichever folder holds routes.txt.
          dir=$(dirname "$(find gtfs -name routes.txt | head -1)")
          echo "GTFS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build data
        run: |
          if [ -f amenities.csv ]; then node scripts/build-data.mjs "$GTFS_DIR" amenities.csv; else node scripts/build-data.mjs "$GTFS_DIR"; fi
      - name: Add Swiftly key from the repository secret
        env:
          SWIFTLY_KEY: ${{ secrets.SWIFTLY_KEY }}
        run: |
          node -e '
            const fs = require("fs"), f = "public/index.html", key = process.env.SWIFTLY_KEY || "";
            if (!key) { console.log("No SWIFTLY_KEY secret set: publishing without live buses."); process.exit(0); }
            fs.writeFileSync(f, fs.readFileSync(f, "utf8").replace("__SWIFTLY_KEY__", key));
            console.log("Swiftly key added.");'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off scheduled workflows in public repos after 60 days with no repository activity.
  # If nothing has been committed for 45 days, this adds an empty commit so the nightly updates never stop.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the nightly schedule active
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep nightly map updates active"
            git push
          fi
